<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle de finanças pessoais: contas, cartões e faturas, contas fixas, parcelamentos, orçamentos e metas.">
<meta name="theme-color" content="#1b5f8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Livro-Caixa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<title>Livro-Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral fixa com as 8 abas (no celular vira barra inferior com 5 + "Mais"),
   cabeçalho com o seletor de mês e conteúdo em grade. Livro-caixa: números em fonte mono tabular. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #edf1f4; --ink: #132029; --ink-2: #44535f; --muted: #6b7a86;
  --line: #dbe2e8; --line-2: #c6d0d8;
  --accent: #1b5f8c; --accent-2: #e2edf5; --accent-ink: #ffffff;
  --pos: #137a46; --pos-bg: #e1f2e8; --neg: #b5372a; --neg-bg: #fbe8e5;
  --warn: #8a5b00; --warn-bg: #fbeecf; --late: #b42318; --late-bg: #fde3e0; --neutro-bg: #e9eef2;
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300; --s6: #4a3aa7; --s7: #e34948; --s8: #8a96a0;
  --sombra: 0 1px 2px rgb(19 32 41 / 6%), 0 6px 20px rgb(19 32 41 / 6%);
  --veu: rgb(19 32 41 / 38%);
  --f-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, Menlo, monospace;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1317; --surface: #141c22; --surface-2: #1a242c; --ink: #e4ebf0; --ink-2: #a7b5bf; --muted: #7c8b96;
    --line: #25313a; --line-2: #34434e;
    --accent: #66a9da; --accent-2: #17303f; --accent-ink: #08131b;
    --pos: #52c48a; --pos-bg: #13301f; --neg: #f0877a; --neg-bg: #3b1d19;
    --warn: #f0b64b; --warn-bg: #392b0f; --late: #ff8d80; --late-bg: #431a1a; --neutro-bg: #1f2a33;
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767; --s8: #6c7983;
    --sombra: 0 1px 0 rgb(0 0 0 / 30%);
    --veu: rgb(0 0 0 / 55%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1317; --surface: #141c22; --surface-2: #1a242c; --ink: #e4ebf0; --ink-2: #a7b5bf; --muted: #7c8b96;
  --line: #25313a; --line-2: #34434e;
  --accent: #66a9da; --accent-2: #17303f; --accent-ink: #08131b;
  --pos: #52c48a; --pos-bg: #13301f; --neg: #f0877a; --neg-bg: #3b1d19;
  --warn: #f0b64b; --warn-bg: #392b0f; --late: #ff8d80; --late-bg: #431a1a; --neutro-bg: #1f2a33;
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300; --s6: #9085e9; --s7: #e66767; --s8: #6c7983;
  --sombra: 0 1px 0 rgb(0 0 0 / 30%);
  --veu: rgb(0 0 0 / 55%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .mudo { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- moldura ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.marca-selo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--f-num); letter-spacing: -0.04em; }
.marca b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: 0; border-radius: var(--r-sm); background: none; color: var(--ink-2); font-weight: 600; font-size: 14.5px; cursor: pointer; text-align: left; }
.nav-item svg { width: 19px; height: 19px; flex: none; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-2); color: var(--accent); }
.lateral .rodape { margin-top: auto; padding: 12px 10px 0; font-size: 12px; color: var(--muted); }

.principal { min-width: 0; padding-inline: 32px; padding-block: 0 48px; }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-block: 18px 14px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 1180px; margin-inline: auto; }
.topo h1 { font-size: 24px; font-weight: 800; }
.seletor-mes { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seletor-mes button { border: 0; background: none; border-radius: 999px; height: 32px; min-width: 32px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.seletor-mes button:hover { background: var(--surface-2); color: var(--ink); }
.seletor-mes button svg { width: 18px; height: 18px; }
.seletor-mes .rotulo { min-width: 138px; text-align: center; font-weight: 700; font-size: 14px; }
.seletor-mes .hoje { font-size: 12.5px; font-weight: 700; padding-inline: 10px; color: var(--accent); }
main { max-width: 1180px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

.inferior { display: none; }
.fab { position: fixed; right: 28px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 30; height: 54px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 22px rgb(19 50 80 / 28%); cursor: pointer; }
.fab svg { width: 22px; height: 22px; }
.fab:hover { filter: brightness(1.07); }

@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { display: none; }
  .principal { padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
  .topo { padding-block: 12px 10px; }
  .topo h1 { font-size: 20px; }
  .seletor-mes .rotulo { min-width: 104px; font-size: 13.5px; }
  .inferior { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .inferior button { flex: 1; min-width: 0; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; padding: 5px 0; cursor: pointer; }
  .inferior button svg { width: 21px; height: 21px; }
  .inferior button[aria-current="page"] { color: var(--accent); }
  .fab { right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 52px; width: 52px; padding: 0; justify-content: center; }
  .fab span { display: none; }
}

/* ---------- blocos ---------- */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.painel-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.painel-cab h2 { font-size: 15.5px; font-weight: 800; }
.painel-cab .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.secao-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.secao-titulo h2 { font-size: 17px; font-weight: 800; }
.grade-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grade-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
@media (max-width: 899px) { .grade-2 { grid-template-columns: minmax(0, 1fr); gap: 16px; } .painel { padding: 16px; } }

.rotulo-mini { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.kpis { display: grid; grid-template-columns: 1.25fr repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.kpi .valor { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .det { font-size: 12.5px; color: var(--muted); }
.kpi.destaque { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.destaque .rotulo-mini, .kpi.destaque .det { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }
.kpi.destaque .valor { font-size: 26px; }
.var { font-family: var(--f-num); font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 5px; }
.var.bom { background: var(--pos-bg); color: var(--pos); } .var.ruim { background: var(--neg-bg); color: var(--neg); } .var.igual { background: var(--neutro-bg); color: var(--muted); }
@media (max-width: 1150px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi.destaque { grid-column: 1 / -1; } }
@media (max-width: 520px) { .kpis { gap: 10px; } .kpi { padding: 13px 13px; } .kpi .valor { font-size: 17px; letter-spacing: -0.04em; } .kpi.destaque .valor { font-size: 24px; } }

/* ---------- botões, campos ---------- */
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.botao:hover { background: var(--surface-2); }
.botao svg { width: 16px; height: 16px; }
.botao.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.botao.primario:hover { filter: brightness(1.07); }
.botao.perigo { color: var(--late); border-color: color-mix(in srgb, var(--late) 40%, var(--line-2)); }
.botao.perigo.cheio { background: var(--late); color: #fff; border-color: var(--late); }
.botao.fantasma { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.botao.fantasma:hover { background: var(--accent-2); }
.botao.peq { height: 30px; padding: 0 10px; font-size: 12.5px; }
.botao:disabled { opacity: .5; cursor: not-allowed; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.campos .largo { grid-column: 1 / -1; }
@media (max-width: 520px) { .campos { grid-template-columns: minmax(0, 1fr); } }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo > span, .campo > legend { font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 0; }
.campo input, .campo select, .campo textarea, .filtros input, .filtros select, .entrada { height: 40px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); width: 100%; min-width: 0; }
.campo input:focus, .campo select:focus, .filtros input:focus, .filtros select:focus, .entrada:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.campo .dica { font-size: 12px; color: var(--muted); }
.campo-valor input { height: 56px; font-family: var(--f-num); font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
.campo-valor .prefixo { position: relative; }
.campo-valor .prefixo::before { content: 'R$'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--f-num); color: var(--muted); font-size: 16px; }
.campo-valor .prefixo input { padding-left: 46px; }
fieldset.campo { border: 0; margin: 0; padding: 0; }
.seg { display: flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 7px 10px; border-radius: 6px; font-weight: 700; font-size: 13.5px; color: var(--ink-2); }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--sombra); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.seg.tipo input[value="despesa"]:checked + span { color: var(--neg); }
.seg.tipo input[value="receita"]:checked + span { color: var(--pos); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.chip > span { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-2); color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); }
.ponto { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.check { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- pílulas de situação ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.pago, .pill.paga { background: var(--pos-bg); color: var(--pos); }
.pill.pendente, .pill.fechada { background: var(--warn-bg); color: var(--warn); }
.pill.atrasado, .pill.atrasada, .pill.estourado { background: var(--late-bg); color: var(--late); }
.pill.cartao, .pill.aberta, .pill.pulado, .pill.vazia, .pill.sem { background: var(--neutro-bg); color: var(--ink-2); }
.pill.alerta { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--pos-bg); color: var(--pos); }
.pill.atrasado::before, .pill.atrasada::before, .pill.estourado::before { border-radius: 1px; transform: rotate(45deg); }

/* ---------- barras de progresso ---------- */
.barra { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.barra > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); max-width: 100%; }
.barra.ok > i { background: var(--pos); } .barra.alerta > i { background: var(--warn); } .barra.estourado > i { background: var(--late); }

/* ---------- listas ---------- */
.linhas { display: flex; flex-direction: column; }
.linha { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 11px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.linha:first-child { border-top: 0; }
.linha:hover { background: var(--surface-2); }
.linha .quando { font-family: var(--f-num); font-size: 12.5px; color: var(--muted); line-height: 1.2; }
.linha .quando b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.linha .desc { min-width: 0; }
.linha .desc strong { display: block; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.linha .meta .tag { font-weight: 700; color: var(--ink-2); }
.linha .lado { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.linha .valor { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; white-space: nowrap; }
.linha.ignorada .desc strong, .linha.ignorada .valor { text-decoration: line-through; color: var(--muted); }
.acao-rapida { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--pos); }
.acao-rapida:hover { background: var(--pos-bg); border-color: var(--pos); }
.acao-rapida svg { width: 17px; height: 17px; }
.espaco-acao { width: 34px; }
@media (max-width: 520px) { .linha { grid-template-columns: 40px minmax(0, 1fr) auto; } .linha .acao-col { display: none; } .linha .quando b { font-size: 14px; } }
.linha.parc { grid-template-columns: minmax(0, 1fr) minmax(0, 170px) auto; }
.linha .prog-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
@media (max-width: 520px) { .linha.parc { grid-template-columns: minmax(0, 1fr) auto; } .linha.parc .prog-col { grid-column: 1 / -1; grid-row: 2; } }
.rodape-lista { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 22px; padding: 12px 6px 0; border-top: 1px solid var(--line-2); font-size: 13px; color: var(--ink-2); }
.rodape-lista b { font-family: var(--f-num); font-weight: 600; }

.vazio { text-align: center; padding: 28px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.vazio strong { color: var(--ink); font-size: 15px; }

.item-simples { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.item-simples:first-child { border-top: 0; }
.item-simples .esq { display: flex; align-items: center; gap: 10px; min-width: 0; }
.item-simples .esq > div { min-width: 0; }
.item-simples .esq strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-simples .esq small { color: var(--muted); font-size: 12.5px; }
.item-simples .dir { display: flex; align-items: center; gap: 10px; flex: none; }
.clicavel { cursor: pointer; border-radius: 6px; }
.clicavel:hover { background: var(--surface-2); }

/* ---------- cartões de conta, cartão e meta ---------- */
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ficha-cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.ficha-cab strong { font-size: 15px; font-weight: 800; display: block; }
.ficha-cab small { color: var(--muted); font-size: 12.5px; }
.ficha .grande { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
.ficha .linha-info { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); }
.ficha .linha-info b { font-family: var(--f-num); font-weight: 600; color: var(--ink); }
.ficha .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.tarja { width: 34px; height: 22px; border-radius: 5px; flex: none; }
.fatura-box { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; }

/* ---------- filtros ---------- */
.filtros { display: grid; grid-template-columns: 2fr repeat(4, minmax(0, 1fr)); gap: 10px; }
.filtros .mais { display: contents; }
.filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); min-width: 0; }
.filtros input, .filtros select { height: 36px; font-size: 13.5px; font-weight: 500; }
.btn-filtros { display: none; }
@media (max-width: 899px) {
  .filtros { grid-template-columns: minmax(0, 1fr) auto; }
  .btn-filtros { display: inline-flex; align-self: end; }
  .filtros .mais { display: none; }
  .filtros.abertos .mais { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}

/* ---------- orçamento ---------- */
.orc { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) 128px; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.orc:first-child { border-top: 0; }
.orc .nome { display: flex; align-items: center; gap: 9px; font-weight: 700; min-width: 0; }
.orc .nome span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orc .prog { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.orc .prog .info { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.orc .prog .info b { font-family: var(--f-num); font-weight: 600; color: var(--ink); }
.orc .limite { position: relative; display: block; min-width: 0; }
.orc .limite input { display: block; width: 100%; min-width: 0; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); text-align: right; font-family: var(--f-num); font-size: 14px; }
.orc .limite input::placeholder { color: var(--muted); font-family: var(--f-ui); font-size: 13px; }
.orc .limite input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 0; border-color: var(--accent); }
.orc .limite::before { content: 'R$'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-num); font-size: 13px; }
@media (max-width: 620px) { .orc { grid-template-columns: minmax(0, 1fr) 118px; } .orc .prog { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- gráficos ---------- */
.grafico { width: 100%; min-height: 60px; position: relative; }
.grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.grafico text { font-family: var(--f-ui); font-size: 11.5px; fill: var(--muted); }
.grafico .eixo { stroke: var(--line-2); stroke-width: 1; }
.grafico .grade-linha { stroke: var(--line); stroke-width: 1; }
.grafico [data-tip] { cursor: default; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.rosca-bloco { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 620px) { .rosca-bloco { grid-template-columns: minmax(0, 1fr); } .rosca-bloco .grafico { max-width: 220px; margin-inline: auto; } }
.leg-lista { display: flex; flex-direction: column; gap: 2px; }
.leg-lista div { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 46px; align-items: center; gap: 9px; padding: 6px 0; font-size: 13.5px; border-top: 1px solid var(--line); }
.leg-lista div:first-child { border-top: 0; }
.leg-lista span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.leg-lista b { font-family: var(--f-num); font-weight: 600; }
.leg-lista em { font-style: normal; font-family: var(--f-num); color: var(--muted); font-size: 12px; text-align: right; }
details.tabela { margin-top: 10px; font-size: 13px; }
details.tabela summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: 12.5px; }
.tabela-wrap { overflow-x: auto; margin-top: 8px; }
table.dados { width: 100%; border-collapse: collapse; font-size: 13px; }
table.dados th, table.dados td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.dados th:first-child, table.dados td:first-child { text-align: left; }
table.dados th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
table.dados td { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.dados td:first-child { font-family: var(--f-ui); font-weight: 600; }
table.dados tfoot td { font-weight: 700; border-bottom: 0; }
.tip { position: fixed; z-index: 80; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 7px; font-size: 12.5px; line-height: 1.45; white-space: pre-line; max-width: 240px; box-shadow: var(--sombra); font-variant-numeric: tabular-nums; }

/* ---------- modal ---------- */
.veu { position: fixed; inset: 0; z-index: 60; background: var(--veu); display: flex; align-items: center; justify-content: center; padding: 24px 16px; animation: aparecer .14s ease-out; }
.modal { background: var(--surface); border-radius: 16px; width: min(560px, 100%); max-height: calc(100vh - 48px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgb(0 0 0 / 25%); animation: subir .18s ease-out; }
.modal.largo { width: min(760px, 100%); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 10px; }
.modal-cab h2 { font-size: 18px; font-weight: 800; }
.fechar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.fechar svg { width: 16px; height: 16px; }
.modal-corpo { padding: 8px 20px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.modal-rodape { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.modal-rodape .dir { display: flex; gap: 10px; margin-left: auto; }
.aviso { padding: 10px 12px; border-radius: var(--r-sm); background: var(--accent-2); color: var(--ink); font-size: 13.5px; }
.aviso.perigo { background: var(--late-bg); color: var(--late); }
.aviso.atencao { background: var(--warn-bg); color: var(--warn); }
.previa { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 9px 12px; }
.erro-campo { color: var(--late); font-size: 13px; font-weight: 700; }
@media (max-width: 620px) {
  .veu { align-items: flex-end; padding: 0; }
  .modal, .modal.largo { width: 100%; border-radius: 18px 18px 0 0; max-height: 92vh; }
}
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { transform: translateY(14px); opacity: 0; } }

/* ---------- avisos rápidos ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / 22%); width: 100%; animation: subir .18s ease-out; }
.toast.erro { background: var(--late); color: #fff; }
.toast button { margin-left: auto; border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 0; }
@media (max-width: 899px) { #toasts { bottom: calc(140px + env(safe-area-inset-bottom, 0px)); } }

.boas-vindas { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.boas-vindas h2 { font-size: 21px; font-weight: 800; margin-bottom: 6px; }
.boas-vindas p { margin: 0 0 14px; color: var(--ink-2); max-width: 52ch; }
.passos { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: p; }
.passos li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; color: var(--ink-2); counter-increment: p; }
.passos li::before { content: counter(p); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font: 700 12.5px/1 var(--f-num); }
.passos b { color: var(--ink); }
@media (max-width: 760px) { .boas-vindas { grid-template-columns: minmax(0, 1fr); padding: 18px; } }

.tela-centro { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.tela-centro > div { max-width: 420px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.tela-centro h2 { font-size: 20px; font-weight: 800; }
.tela-centro p { margin: 0; color: var(--ink-2); }
.carregando { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); animation: girar .8s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.troca-cor { display: flex; gap: 8px; flex-wrap: wrap; }
.troca-cor label { position: relative; }
.troca-cor input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.troca-cor span { display: block; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.troca-cor input:checked + span { box-shadow: 0 0 0 2px var(--ink); }
.troca-cor input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.mais-abas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mais-abas button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; font-weight: 700; text-align: left; }
.mais-abas button svg { width: 22px; height: 22px; color: var(--accent); }
.sep { height: 1px; background: var(--line); margin: 2px 0; }

/* ---------- base (antes vinha do esqueleto do Artifact) ---------- */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* ---------- entrada e conta ---------- */
body.fora .lateral, body.fora .inferior, body.fora .topo { display: none; }
body.fora .app { grid-template-columns: minmax(0, 1fr); }
body.fora .principal { padding-block: 0; }
.tela-login { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; }
.cartao-login { width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--sombra); }
.cartao-login h2 { font-size: 24px; font-weight: 800; line-height: 1.2; }
.cartao-login p { margin: 0; color: var(--ink-2); }
.cartao-login .letra-miuda { font-size: 12.5px; color: var(--muted); }
.botao.entrar { height: 48px; font-size: 15px; gap: 10px; }
@media (max-width: 520px) { .cartao-login { padding: 24px 18px; } .cartao-login h2 { font-size: 21px; } }
.usuario { display: flex; align-items: center; gap: 10px; min-width: 0; }
.usuario .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--accent-2); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
.usuario .avatar img { width: 100%; height: 100%; object-fit: cover; }
.usuario .quem { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.usuario .quem strong { font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario .quem small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lateral .rodape { padding-inline: 4px; }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<div class="app">
  <aside class="lateral" aria-label="Navegação">
    <div class="marca"><div class="marca-selo">R$</div><b>Livro-Caixa</b></div>
    <nav id="nav-lateral" style="display:flex;flex-direction:column;gap:2px"></nav>
    <div class="rodape" id="rodape-lateral"></div>
  </aside>
  <div class="principal">
    <header class="topo">
      <h1 id="titulo-aba">Dashboard</h1>
      <div class="seletor-mes" id="seletor-mes">
        <button type="button" data-acao="mes-ant" aria-label="Mês anterior"></button>
        <div class="rotulo" id="rotulo-mes"></div>
        <button type="button" data-acao="mes-prox" aria-label="Próximo mês"></button>
        <button type="button" class="hoje" data-acao="mes-hoje">Hoje</button>
      </div>
    </header>
    <main id="conteudo"></main>
  </div>
</div>
<nav class="inferior" id="nav-inferior" aria-label="Navegação"></nav>
<button type="button" class="fab" id="fab" data-acao="novo" hidden aria-label="Novo lançamento"></button>
<div id="modal-raiz"></div>
<div id="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<script>/* Núcleo de cálculo: funções puras, sem DOM e sem banco.
   Valores sempre em centavos inteiros; meses como "AAAA-MM"; datas como "AAAA-MM-DD". */
(function (raiz) {
  'use strict';
  const N = {};

  // ---------- datas ----------
  const pad = (n) => String(n).padStart(2, '0');
  N.isoDe = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  N.hoje = () => N.isoDe(new Date());
  N.mesDe = (iso) => String(iso).slice(0, 7);
  N.dia = (iso) => Number(String(iso).slice(8, 10));
  const idxMes = (mes) => { const [a, m] = mes.split('-').map(Number); return a * 12 + (m - 1); };
  const mesDeIdx = (t) => `${Math.floor(t / 12)}-${pad((t % 12) + 1)}`;
  N.addMes = (mes, n) => mesDeIdx(idxMes(mes) + n);
  /** b - a, em meses. */
  N.difMes = (a, b) => idxMes(b) - idxMes(a);
  N.diasNoMes = (mes) => { const [a, m] = mes.split('-').map(Number); return new Date(a, m, 0).getDate(); };
  N.dataNoMes = (mes, dia) => `${mes}-${pad(Math.min(Math.max(1, Number(dia) || 1), N.diasNoMes(mes)))}`;
  N.addDias = (iso, n) => { const [a, m, d] = iso.split('-').map(Number); return N.isoDe(new Date(a, m - 1, d + n)); };
  N.fimDoMes = (mes) => N.dataNoMes(mes, 31);
  N.mesesEntre = (de, ate) => { const r = []; for (let t = idxMes(de); t <= idxMes(ate); t++) r.push(mesDeIdx(t)); return r; };
  N.dataValida = (iso) => /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')) && N.isoDe(new Date(...String(iso).split('-').map((v, i) => i === 1 ? Number(v) - 1 : Number(v)))) === iso;
  N.mesValido = (mes) => /^\d{4}-(0[1-9]|1[0-2])$/.test(String(mes || ''));

  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  N.nomeMes = (mes, longo) => { const [a, m] = mes.split('-').map(Number); return longo ? `${MESES_LONGOS[m - 1]} de ${a}` : `${MESES[m - 1]}/${String(a).slice(2)}`; };
  N.nomeMesCurto = (mes) => MESES[Number(mes.slice(5, 7)) - 1];
  N.dataCurta = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';
  N.dataLonga = (iso) => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '';

  // ---------- dinheiro ----------
  /** "1.234,56" | "1234,56" | "1234.56" | "1234" -> centavos. NaN se inválido. */
  N.paraCentavos = (txt) => {
    if (typeof txt === 'number') return Number.isFinite(txt) ? Math.round(txt * 100) : NaN;
    let s = String(txt == null ? '' : txt).trim().replace(/R\$|\s| /g, '');
    if (!s) return NaN;
    let neg = false;
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
    const [int, dec = ''] = s.split('.');
    const c = Number(int) * 100 + Number((dec + '00').slice(0, 2));
    return neg ? -c : c;
  };
  const fmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  N.brl = (c) => fmt.format((Number(c) || 0) / 100);
  N.paraTexto = (c) => ((Number(c) || 0) / 100).toFixed(2).replace('.', ',');
  N.soma = (arr, f) => arr.reduce((t, x) => t + (f ? f(x) : x), 0);

  // ---------- cartão ----------
  const diaFech = (cartao, mes) => Math.min(Number(cartao.fechamento) || 1, N.diasNoMes(mes));
  /** Mês de VENCIMENTO da fatura em que cai uma compra feita em `iso`.
      Compra no dia do fechamento ou depois vai para a fatura seguinte. */
  N.mesFatura = (cartao, iso) => {
    const m = N.mesDe(iso);
    const fechaEm = N.dia(iso) < diaFech(cartao, m) ? m : N.addMes(m, 1);
    return Number(cartao.vencimento) > Number(cartao.fechamento) ? fechaEm : N.addMes(fechaEm, 1);
  };
  N.mesFechamento = (cartao, V) => (Number(cartao.vencimento) > Number(cartao.fechamento) ? V : N.addMes(V, -1));
  N.fechamentoDe = (cartao, V) => N.dataNoMes(N.mesFechamento(cartao, V), cartao.fechamento);
  N.vencimentoDe = (cartao, V) => N.dataNoMes(V, cartao.vencimento);

  // ---------- parcelamentos ----------
  /** Divide `total` em `n` parcelas; os centavos que sobram vão para a 1ª. */
  N.valoresParcelas = (total, n) => {
    n = Math.max(1, Math.floor(n));
    const base = Math.floor(total / n);
    const resto = total - base * n;
    return Array.from({ length: n }, (_, i) => (i === 0 ? base + resto : base));
  };
  N.parcelasDe = (p, cartao) => {
    if (!p || !cartao || !N.dataValida(p.dataCompra)) return [];
    const m0 = N.mesFatura(cartao, p.dataCompra);
    const vals = N.valoresParcelas(p.valorTotal, p.parcelas);
    const ant = new Map((p.antecipacoes || []).map((a) => [a.num, a]));
    return vals.map((v, i) => {
      const num = i + 1;
      const a = ant.get(num);
      const mesOriginal = N.addMes(m0, i);
      return { num, de: vals.length, valor: a ? a.valor : v, mes: a ? a.mes : mesOriginal, mesOriginal, antecipada: !!a };
    });
  };
  /** Parcelas que ainda estão em faturas posteriores a `mesAtual`. */
  N.parcelasFuturas = (p, cartao, mesAtual) =>
    N.parcelasDe(p, cartao).filter((x) => !x.antecipada && N.difMes(mesAtual, x.mes) > 0);
  /** Traz as ÚLTIMAS `qtd` parcelas futuras para a fatura `mesAtual`, com desconto opcional.
      Devolve um novo parcelamento (não altera o original). */
  N.antecipar = (p, cartao, qtd, mesAtual, desconto) => {
    const futuras = N.parcelasFuturas(p, cartao, mesAtual);
    const alvo = futuras.slice(Math.max(0, futuras.length - Math.max(0, Math.floor(qtd))));
    if (!alvo.length) return p;
    const soma = N.soma(alvo, (x) => x.valor);
    const desc = Math.min(Math.max(0, Math.round(Number(desconto) || 0)), soma);
    const vals = N.valoresParcelas(soma - desc, alvo.length);
    return {
      ...p,
      antecipacoes: [...(p.antecipacoes || []), ...alvo.map((x, i) => ({ num: x.num, mes: mesAtual, valor: vals[i] }))],
    };
  };
  N.quitar = (p, cartao, mesAtual, desconto) =>
    N.antecipar(p, cartao, N.parcelasFuturas(p, cartao, mesAtual).length, mesAtual, desconto);

  // ---------- recorrência ----------
  N.idOcorrencia = (rid, mes) => `rec_${rid}_${mes}`;

  // ---------- montagem dos itens ----------
  const porId = (lista) => { const m = new Map(); for (const x of lista || []) m.set(x.id, x); return m; };

  /** Mês em que um lançamento conta (regime de caixa).
      Cartão: mês da fatura. Conta: mês do vencimento (ou da data). */
  N.mesRef = (l, cartoes) => {
    if (l.tipo !== 'transferencia' && l.cartaoId) {
      const c = cartoes.get(l.cartaoId);
      if (c) return N.mesFatura(c, l.data);
    }
    return N.mesDe(l.tipo === 'transferencia' ? l.data : (l.vencimento || l.data));
  };

  N.situacao = (item, hoje) => {
    if (item.ignorada) return 'pulado';
    if (item.cartaoId) return 'cartao';
    if (item.status === 'pago') return 'pago';
    return (item.vencimento || item.data) < hoje ? 'atrasado' : 'pendente';
  };

  /**
   * Todos os itens de receita/despesa (sem transferências), cada um com `mes` calculado:
   *  - lançamentos gravados;
   *  - ocorrências virtuais das contas fixas (até `mesAte`) que ainda não viraram documento;
   *  - parcelas de cada parcelamento.
   */
  N.itens = (dados, mesAte, hoje) => {
    const cartoes = porId(dados.cartoes);
    const lancs = dados.lancamentos || [];
    const gravados = porId(lancs);
    const out = [];
    for (const l of lancs) {
      if (l.tipo !== 'receita' && l.tipo !== 'despesa') continue;
      const it = { ...l, fonte: 'lanc', mes: N.mesRef(l, cartoes) };
      if (it.cartaoId && !cartoes.has(it.cartaoId)) it.cartaoId = null;
      it.situacao = N.situacao(it, hoje);
      out.push(it);
    }
    for (const r of dados.recorrentes || []) {
      if (!N.mesValido(r.inicio)) continue;
      const fim = r.fim && N.difMes(r.fim, mesAte) > 0 ? r.fim : mesAte;
      if (N.difMes(r.inicio, fim) < 0) continue;
      for (const m of N.mesesEntre(r.inicio, fim)) {
        const id = N.idOcorrencia(r.id, m);
        if (gravados.has(id)) continue;
        const data = N.dataNoMes(m, r.dia);
        const cartaoId = r.cartaoId && cartoes.has(r.cartaoId) ? r.cartaoId : null;
        const it = {
          id, fonte: 'virtual', virtual: true, tipo: r.tipo, valor: r.valor, descricao: r.descricao,
          categoriaId: r.categoriaId, contaId: cartaoId ? null : r.contaId, cartaoId, pagamento: r.pagamento,
          data, vencimento: data, status: 'pendente', origem: 'recorrente', recorrenteId: r.id, mesRecorrencia: m,
        };
        it.mes = N.mesRef(it, cartoes);
        it.situacao = N.situacao(it, hoje);
        out.push(it);
      }
    }
    for (const p of dados.parcelamentos || []) {
      const c = cartoes.get(p.cartaoId);
      for (const x of N.parcelasDe(p, c)) {
        out.push({
          id: `parc_${p.id}_${x.num}`, fonte: 'parcela', tipo: 'despesa', valor: x.valor,
          descricao: p.descricao, categoriaId: p.categoriaId, cartaoId: p.cartaoId, contaId: null,
          data: p.dataCompra, pagamento: 'credito', mes: x.mes, parcela: x, parcelamentoId: p.id, situacao: 'cartao',
        });
      }
    }
    return out;
  };

  const conta = (it) => !it.ignorada;
  const ehReceita = (it) => it.tipo === 'receita';
  const ehDespesa = (it) => it.tipo === 'despesa';

  // ---------- faturas ----------
  N.pagamentosFatura = (dados, cartaoId, V) =>
    N.soma((dados.lancamentos || []).filter((l) => l.tipo === 'transferencia' && l.faturaCartaoId === cartaoId && l.faturaMes === V), (l) => l.valor);

  N.fatura = (dados, itens, cartao, V, hoje) => {
    const doCartao = itens.filter((i) => i.cartaoId === cartao.id && i.mes === V && conta(i));
    const total = N.soma(doCartao.filter(ehDespesa), (i) => i.valor) - N.soma(doCartao.filter(ehReceita), (i) => i.valor);
    const pago = N.pagamentosFatura(dados, cartao.id, V);
    const restante = Math.max(0, total - pago);
    const fechamento = N.fechamentoDe(cartao, V);
    const vencimento = N.vencimentoDe(cartao, V);
    let status;
    if (total <= 0 && pago === 0) status = 'vazia';
    else if (restante === 0) status = 'paga';
    else if (hoje < fechamento) status = 'aberta';
    else if (hoje <= vencimento) status = 'fechada';
    else status = 'atrasada';
    return { cartaoId: cartao.id, mes: V, itens: doCartao, total, pago, restante, fechamento, vencimento, status };
  };

  /** Limite já comprometido: compras feitas até hoje (parcelamento conta inteiro) menos pagamentos de fatura. */
  N.limiteUsado = (dados, itens, cartao, hoje) => {
    let usado = 0;
    for (const i of itens) {
      if (i.cartaoId !== cartao.id || !conta(i)) continue;
      if (i.data > hoje) continue;
      usado += ehReceita(i) ? -i.valor : i.valor;
    }
    const pagos = N.soma((dados.lancamentos || []).filter((l) => l.tipo === 'transferencia' && l.faturaCartaoId === cartao.id), (l) => l.valor);
    return Math.max(0, usado - pagos);
  };

  /** Meses de fatura do cartão que têm itens ou pagamentos. */
  N.mesesDeFatura = (dados, itens, cartao) => {
    const s = new Set();
    for (const i of itens) if (i.cartaoId === cartao.id && conta(i)) s.add(i.mes);
    for (const l of dados.lancamentos || []) if (l.faturaCartaoId === cartao.id && l.faturaMes) s.add(l.faturaMes);
    return [...s].sort();
  };

  // ---------- saldos ----------
  /** Data em que um lançamento pago mexeu no saldo. */
  N.dataEfetiva = (l) => (l.tipo === 'transferencia' ? l.data : (l.dataPagamento || l.vencimento || l.data));

  /** Saldo de cada conta considerando tudo o que já foi pago/recebido (até `ateData`, se informado). */
  N.saldosContas = (dados, ateData) => {
    const s = new Map();
    for (const c of dados.contas || []) s.set(c.id, Number(c.saldoInicial) || 0);
    const mexe = (id, v) => { if (id && s.has(id)) s.set(id, s.get(id) + v); };
    for (const l of dados.lancamentos || []) {
      if (l.ignorada) continue;
      if (ateData && N.dataEfetiva(l) > ateData) continue;
      if (l.tipo === 'transferencia') { mexe(l.contaId, -l.valor); mexe(l.contaDestinoId, l.valor); continue; }
      if (l.status !== 'pago' || l.cartaoId) continue;
      mexe(l.contaId, l.tipo === 'receita' ? l.valor : -l.valor);
    }
    return s;
  };
  N.saldoTotal = (dados, ateData) => N.soma([...N.saldosContas(dados, ateData).values()]);

  // ---------- metas ----------
  N.guardadoMeta = (dados, meta) => {
    let v = Number(meta.valorInicial) || 0;
    for (const l of dados.lancamentos || []) {
      if (l.metaId !== meta.id) continue;
      v += l.metaSentido === 'saida' ? -l.valor : l.valor;
    }
    return v;
  };
  N.progressoMeta = (dados, meta, hoje) => {
    const guardado = N.guardadoMeta(dados, meta);
    const falta = Math.max(0, (Number(meta.alvo) || 0) - guardado);
    let porMes = null, meses = null;
    if (meta.prazo && N.dataValida(meta.prazo) && falta > 0) {
      meses = Math.max(1, N.difMes(N.mesDe(hoje), N.mesDe(meta.prazo)) + (N.dia(meta.prazo) >= N.dia(hoje) ? 1 : 0));
      porMes = Math.ceil(falta / meses);
    }
    const pct = meta.alvo > 0 ? guardado / meta.alvo : 0;
    return { guardado, falta, pct, porMes, meses, atingida: meta.alvo > 0 && guardado >= meta.alvo };
  };

  // ---------- resumo do mês ----------
  N.resumoMes = (dados, itens, mes, hoje) => {
    const doMes = itens.filter((i) => i.mes === mes && conta(i));
    const rec = doMes.filter(ehReceita);
    const desp = doMes.filter(ehDespesa);
    const cartoes = dados.cartoes || [];
    const faturasPagas = new Set(cartoes.filter((c) => N.fatura(dados, itens, c, mes, hoje).status === 'paga').map((c) => c.id));
    const porCategoria = new Map();
    for (const d of desp) porCategoria.set(d.categoriaId || '', (porCategoria.get(d.categoriaId || '') || 0) + d.valor);
    for (const r of doMes.filter((i) => ehReceita(i) && i.cartaoId)) porCategoria.set(r.categoriaId || '', (porCategoria.get(r.categoriaId || '') || 0) - r.valor);
    return {
      mes,
      receitas: N.soma(rec, (i) => i.valor),
      receitasRecebidas: N.soma(rec.filter((i) => i.situacao === 'pago'), (i) => i.valor),
      despesas: N.soma(desp, (i) => i.valor) - N.soma(rec.filter((i) => i.cartaoId), (i) => i.valor),
      despesasPagas: N.soma(desp.filter((i) => i.situacao === 'pago' || (i.cartaoId && faturasPagas.has(i.cartaoId))), (i) => i.valor),
      porCategoria,
    };
  };

  /** Pendências de contas (não cartão) e faturas com saldo em aberto, de todos os meses até `mes`. */
  N.pendencias = (dados, itens, mes, hoje) => {
    const lista = [];
    for (const i of itens) {
      if (!conta(i) || i.cartaoId) continue;
      if (i.situacao !== 'pendente' && i.situacao !== 'atrasado') continue;
      if (N.difMes(i.mes, mes) < 0) continue;
      lista.push({ tipo: i.tipo, valor: i.valor, vencimento: i.vencimento || i.data, atrasado: i.situacao === 'atrasado', item: i });
    }
    for (const c of dados.cartoes || []) {
      for (const V of N.mesesDeFatura(dados, itens, c)) {
        if (N.difMes(V, mes) < 0) continue;
        const f = N.fatura(dados, itens, c, V, hoje);
        if (f.restante <= 0) continue;
        lista.push({ tipo: 'despesa', valor: f.restante, vencimento: f.vencimento, atrasado: f.status === 'atrasada', fatura: f, cartao: c });
      }
    }
    return lista;
  };

  N.painel = (dados, itens, mes, hoje) => {
    const saldoAtual = N.saldoTotal(dados);
    const pend = N.pendencias(dados, itens, mes, hoje);
    const receitasPendentes = N.soma(pend.filter((p) => p.tipo === 'receita'), (p) => p.valor);
    const despesasPendentes = N.soma(pend.filter((p) => p.tipo === 'despesa'), (p) => p.valor);
    return {
      saldoAtual, receitasPendentes, despesasPendentes,
      saldoPrevisto: saldoAtual + receitasPendentes - despesasPendentes,
      pendencias: pend,
      atual: N.resumoMes(dados, itens, mes, hoje),
      anterior: N.resumoMes(dados, itens, N.addMes(mes, -1), hoje),
    };
  };

  // ---------- orçamento ----------
  N.nivelOrcamento = (gasto, limite) => {
    if (!limite) return 'sem';
    const p = gasto / limite;
    return p > 1 ? 'estourado' : p >= 0.8 ? 'alerta' : 'ok';
  };

  // ---------- backup ----------
  N.COLECOES = ['contas', 'cartoes', 'categorias', 'lancamentos', 'recorrentes', 'parcelamentos', 'orcamentos', 'metas'];
  N.FORMATO_BACKUP = 1;
  N.ID_VALIDO = /^[A-Za-z0-9_\-.~:@+]{1,180}$/;
  N.hash = (txt) => { let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h * 33) ^ txt.charCodeAt(i)) >>> 0; return h.toString(36); };
  N.montarBackup = (dados, agoraIso) => ({
    app: 'financas-pessoais', formato: N.FORMATO_BACKUP, exportadoEm: agoraIso,
    dados: Object.fromEntries(N.COLECOES.map((c) => [c, (dados[c] || []).slice().sort((a, b) => (a.id < b.id ? -1 : 1))])),
  });
  N.hashDados = (dados) => N.hash(JSON.stringify(N.montarBackup(dados, '').dados));

  /** Valida um backup lido de arquivo. Não altera nada. */
  N.validarBackup = (obj) => {
    const erros = [];
    if (!obj || typeof obj !== 'object') return { ok: false, erros: ['O arquivo não é um backup deste app.'] };
    if (obj.app !== 'financas-pessoais' || !obj.dados || typeof obj.dados !== 'object') return { ok: false, erros: ['O arquivo não é um backup deste app.'] };
    if (Number(obj.formato) > N.FORMATO_BACKUP) return { ok: false, erros: ['Este backup foi feito por uma versão mais nova do app.'] };
    const dados = {};
    const contagem = {};
    for (const c of N.COLECOES) {
      const lista = obj.dados[c] == null ? [] : obj.dados[c];
      if (!Array.isArray(lista)) { erros.push(`"${c}" não é uma lista.`); continue; }
      const ids = new Set();
      lista.forEach((x, i) => {
        if (!x || typeof x !== 'object' || Array.isArray(x)) erros.push(`${c}[${i}] não é um registro.`);
        else if (typeof x.id !== 'string' || !N.ID_VALIDO.test(x.id)) erros.push(`${c}[${i}] tem um id inválido.`);
        else if (ids.has(x.id)) erros.push(`${c}: o id "${x.id}" aparece duas vezes.`);
        else ids.add(x.id);
        if (x && 'valor' in x && !Number.isInteger(x.valor)) erros.push(`${c}[${i}] tem um valor que não é inteiro em centavos.`);
      });
      dados[c] = lista;
      contagem[c] = lista.length;
    }
    return { ok: erros.length === 0, erros: erros.slice(0, 8), totalErros: erros.length, dados, contagem, exportadoEm: obj.exportadoEm || null };
  };

  /** Divide um texto em pedaços de até `tam` caracteres. */
  N.partir = (txt, tam) => { const r = []; for (let i = 0; i < txt.length; i += tam) r.push(txt.slice(i, i + tam)); return r.length ? r : ['']; };

  // ---------- CSV ----------
  N.csv = (dados, itens) => {
    const nome = (lista, id) => (lista || []).find((x) => x.id === id)?.nome || '';
    const q = (v) => { const s = String(v == null ? '' : v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const FORMA = { pix: 'Pix', debito: 'Débito', dinheiro: 'Dinheiro', boleto: 'Boleto', transferencia: 'TED/DOC', credito: 'Crédito' };
    const SIT = { pago: 'Pago', pendente: 'Pendente', atrasado: 'Atrasado', cartao: 'No cartão', pulado: 'Pulado' };
    const linhas = [['Data', 'Vencimento', 'Mês', 'Tipo', 'Descrição', 'Categoria', 'Conta/Cartão', 'Forma', 'Situação', 'Parcela', 'Valor']];
    const lista = itens.filter((i) => i.fonte !== 'virtual').slice().sort((a, b) => (a.mes + a.data < b.mes + b.data ? -1 : 1));
    for (const i of lista) {
      linhas.push([
        N.dataLonga(i.data), N.dataLonga(i.cartaoId ? '' : i.vencimento), i.mes, i.tipo === 'receita' ? 'Receita' : 'Despesa', i.descricao,
        nome(dados.categorias, i.categoriaId), i.cartaoId ? nome(dados.cartoes, i.cartaoId) : nome(dados.contas, i.contaId),
        FORMA[i.pagamento] || i.pagamento || '', SIT[i.situacao] || '', i.parcela ? `${i.parcela.num}/${i.parcela.de}` : '',
        N.paraTexto(i.tipo === 'despesa' ? -i.valor : i.valor),
      ]);
    }
    for (const l of (dados.lancamentos || []).filter((x) => x.tipo === 'transferencia').sort((a, b) => (a.data < b.data ? -1 : 1))) {
      const de = nome(dados.contas, l.contaId) || (l.metaId && l.metaSentido === 'saida' ? 'Meta: ' + nome(dados.metas, l.metaId) : '');
      const para = nome(dados.contas, l.contaDestinoId) || (l.faturaCartaoId ? 'Fatura ' + nome(dados.cartoes, l.faturaCartaoId) : '') || (l.metaId ? 'Meta: ' + nome(dados.metas, l.metaId) : '');
      linhas.push([N.dataLonga(l.data), '', N.mesDe(l.data), 'Transferência', l.descricao, '', `${de} → ${para}`, '', 'Pago', '', N.paraTexto(l.valor)]);
    }
    return '﻿' + linhas.map((r) => r.map(q).join(';')).join('\r\n');
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = N;
  else raiz.Nucleo = N;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Camada de dados: Firebase (login Google + Firestore). Cada pessoa só enxerga users/<uid>/...
   Lançamentos ficam agrupados por mês em users/<uid>/lancamentos_mes/<AAAA-MM>, num mapa "itens". */
(function (raiz) {
  'use strict';
  const N = raiz.Nucleo;
  const COLS = N.COLECOES;
  const SIMPLES = COLS.filter((c) => c !== 'lancamentos');
  const TAM_PARTE = 250000; // caracteres por parte de backup (folga para o limite de 1 MiB por documento)
  const MAX_BACKUPS = 7;
  const MAX_LOTE = 450;
  const ESPERA_CONFIRMACAO = 4000;

  const MENSAGENS = {
    'permission-denied': 'Sem permissão para gravar. Saia e entre de novo na sua conta.',
    unauthenticated: 'Sua sessão expirou. Entre de novo na sua conta.',
    'resource-exhausted': 'O limite diário do banco foi atingido. Tente de novo mais tarde.',
    'invalid-argument': 'O registro foi recusado pelo banco.',
    unavailable: 'Sem conexão com o banco agora. Tente de novo em instantes.',
    'deadline-exceeded': 'O banco demorou para responder. Tente de novo.',
    'auth/popup-closed-by-user': 'A janela de login foi fechada antes de terminar.',
    'auth/cancelled-popup-request': 'A janela de login foi fechada antes de terminar.',
    'auth/unauthorized-domain': 'Este endereço ainda não foi autorizado no Firebase (Authentication → Settings → Domínios autorizados).',
    'auth/network-request-failed': 'Sem internet para fazer o login.',
  };
  const mensagemErro = (e) => MENSAGENS[e && e.code] || (e && e.message) || 'Erro desconhecido.';

  /** Mês do grupo de um lançamento. Fica fixo depois da primeira gravação (campo `grupo`). */
  const grupoDe = (l) => {
    if (l.grupo && N.mesValido(l.grupo)) return l.grupo;
    if (l.origem === 'recorrente' && N.mesValido(l.mesRecorrencia)) return l.mesRecorrencia;
    if (N.dataValida(l.data)) return N.mesDe(l.data);
    if (l.criadoEm && N.mesValido(String(l.criadoEm).slice(0, 7))) return String(l.criadoEm).slice(0, 7);
    return '0000-01';
  };
  function limpar(o) {
    const r = structuredClone(o);
    for (const k of Object.keys(r)) if (r[k] === undefined) delete r[k];
    delete r.id;
    return r;
  }
  /** Agrupa uma lista de lançamentos em { mes: { id: dados } } (para importar de uma vez). */
  const agrupar = (lista) => {
    const g = {};
    for (const l of lista) {
      const mes = grupoDe(l);
      const dados = limpar(l);
      dados.grupo = mes;
      (g[mes] = g[mes] || {})[l.id] = dados;
    }
    return g;
  };

  /** Espera a confirmação do servidor por alguns segundos. Sem internet, a gravação fica guardada no
      aparelho e é enviada depois: nesse caso resolve com { pendente: true }. Erros tardios vão para aoErroTardio. */
  function confirmar(promessa, D) {
    let decidido = false;
    return new Promise((ok, falha) => {
      const t = setTimeout(() => { decidido = true; ok({ pendente: true }); }, ESPERA_CONFIRMACAO);
      promessa.then(() => { if (!decidido) { clearTimeout(t); ok({ pendente: false }); } },
        (e) => { if (!decidido) { clearTimeout(t); falha(e); } else if (D.aoErroTardio) D.aoErroTardio(e); });
    });
  }

  const D = {
    pronto: false,
    exibivel: false,
    erroInicial: null,
    erroLogin: null,
    usuario: null,
    estado: Object.fromEntries(COLS.map((c) => [c, new Map()])),
    backups: new Map(),
    fin: null,
    versao: 0,
    aoErroTardio: null,
    grupoDe, agrupar, mensagemErro,
    _grupo: new Map(),
    _prontos: new Set(),
    _entregues: new Set(),
    _comDados: false,
    _cancelar: [],
    _ouvintes: new Set(),
    _ouvintesConta: new Set(),
    _filas: new Map(),

    ouvir(fn) { this._ouvintes.add(fn); return () => this._ouvintes.delete(fn); },
    ouvirConta(fn) { this._ouvintesConta.add(fn); return () => this._ouvintesConta.delete(fn); },
    _avisar() { this.versao++; for (const fn of this._ouvintes) { try { fn(); } catch (e) { console.error(e); } } },
    _avisarConta() { for (const fn of this._ouvintesConta) { try { fn(this.usuario); } catch (e) { console.error(e); } } },

    lista() { return Object.fromEntries(COLS.map((c) => [c, [...this.estado[c].values()]])); },

    /** Liga o Firebase. Devolve false se o site não estiver configurado. */
    iniciar(fb, config) {
      if (!fb || !config || !config.apiKey) { this.erroInicial = 'sem-config'; return false; }
      this.fb = fb;
      fb.initializeApp(config);
      this.auth = fb.auth();
      this.db = fb.firestore();
      try { const p = this.db.enablePersistence({ synchronizeTabs: true }); if (p && p.catch) p.catch(() => {}); } catch (e) { /* sem cache local neste navegador */ }
      if (this.auth.getRedirectResult) this.auth.getRedirectResult().catch((e) => { this.erroLogin = mensagemErro(e); this._avisarConta(); });
      this.auth.onAuthStateChanged((u) => {
        this._desligar();
        this.usuario = u ? { uid: u.uid, nome: u.displayName || '', email: u.email || '', foto: u.photoURL || '' } : null;
        if (u) this._ligar(u.uid);
        this._avisarConta();
        this._avisar();
      });
      return true;
    },

    async entrar() {
      this.erroLogin = null;
      const prov = new this.fb.auth.GoogleAuthProvider();
      try { await this.auth.signInWithPopup(prov); } catch (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) { await this.auth.signInWithRedirect(prov); return; }
        throw e;
      }
    },
    async sair() { await this.auth.signOut(); },

    _desligar() {
      for (const f of this._cancelar) { try { f(); } catch (e) { /* já parado */ } }
      this._cancelar = [];
      this.estado = Object.fromEntries(COLS.map((c) => [c, new Map()]));
      this.backups = new Map();
      this.fin = null;
      this._grupo = new Map();
      this._prontos = new Set();
      this._entregues = new Set();
      this._comDados = false;
      this.pronto = false;
      this.exibivel = false;
      this.erroInicial = null;
      this.raiz = null;
    },
    _ligar(uid) {
      this.raiz = this.db.collection('users').doc(uid);
      const nomes = [...SIMPLES, 'lancamentos', 'backups', 'fin'];

      await this._enfileirar(`${col}/${id}`, () => confirmar(ref.set(dados), this));
      return id;
    },
    async excluir(col, id) {
      this._exigirLogin();
      if (col === 'lancamentos') {
        const mes = this._grupo.get(id);
        if (!mes) return;
        const ref = this.raiz.collection('lancamentos_mes').doc(mes);
        const campo = new this.fb.firestore.FieldPath('itens', id);
        await this._enfileirar(`lm/${mes}`, () => confirmar(ref.update(campo, this.fb.firestore.FieldValue.delete()), this));

      }
      await this._enfileirar(`${col}/${id}`, () => confirmar(this.raiz.collection(col).doc(id).delete(), this));
    },
    async salvarFin(patch) {
      this._exigirLogin();
      await this._enfileirar('fin', () => confirmar(this.raiz.set(patch, { merge: true }), this));
    },

    /** Executa tarefas com poucas em paralelo, avisando o progresso. */
    async emLote(tarefas, aoAvancar) {
      let feitas = 0;
      const fila = tarefas.slice();
      const trabalhar = async () => {
        while (fila.length) {
          const t = fila.shift();
          await t();
          feitas++;
          if (aoAvancar) aoAvancar(feitas, tarefas.length);
        }

      await Promise.all([trabalhar(), trabalhar(), trabalhar()]);
    },
    /** Grava uma lista de operações em lotes atômicos de até MAX_LOTE. */
    async _emLotes(ops, aoAvancar) {
      for (let i = 0; i < ops.length; i += MAX_LOTE) {
        const b = this.db.batch();
        for (const op of ops.slice(i, i + MAX_LOTE)) op(b);
        await confirmar(b.commit(), this);
        if (aoAvancar) aoAvancar(Math.min(ops.length, i + MAX_LOTE), ops.length);
      }
    },

    // ---------- backups ----------
    listaBackups() { return [...this.backups.values()].sort((a, b) => (a.criadoEm < b.criadoEm ? 1 : -1)); },

    async criarBackup(motivo) {
      this._exigirLogin();
      const dados = this.lista();
      const txt = JSON.stringify(N.montarBackup(dados, new Date().toISOString()));
      const partes = N.partir(txt, TAM_PARTE);
      const id = this.novoId('bk');
      const ops = partes.map((p, i) => (b) => b.set(this.raiz.collection('backupPartes').doc(`${id}_${i}`), { conteudo: p }));
      const contagem = Object.fromEntries(COLS.map((c) => [c, dados[c].length]));
      ops.push((b) => b.set(this.raiz.collection('backups').doc(id), {
        criadoEm: new Date().toISOString(), dia: N.hoje(), motivo: motivo || 'automático', hash: N.hashDados(dados), partes: partes.length, contagem,
      }));
      await this._emLotes(ops);
      await this._podar(id);
      return id;
    },
    async _podar(manterId) {
      const sobra = this.listaBackups().filter((b) => b.id !== manterId).slice(MAX_BACKUPS - 1);
      for (const b of sobra) await this.excluirBackup(b);

    async excluirBackup(b) {
      const ops = [(x) => x.delete(this.raiz.collection('backups').doc(b.id))];
      for (let i = 0; i < (b.partes || 0); i++) ops.push((x) => x.delete(this.raiz.collection('backupPartes').doc(`${b.id}_${i}`)));
      await this._emLotes(ops);
    },
    async lerBackup(b) {
      this._exigirLogin();
      let txt = '';
      for (let i = 0; i < b.partes; i++) {
        const s = await this.raiz.collection('backupPartes').doc(`${b.id}_${i}`).get();
        if (!s.exists) throw { code: 'invalid-argument', message: 'Uma parte deste backup está faltando.' };
        txt += s.data().conteudo;
      }
      return JSON.parse(txt);
    },
    /** Backup automático: no máximo um por dia, e só se algo mudou. */
    async backupDiario() {
      const dados = this.lista();
      const vazio = COLS.filter((c) => c !== 'categorias').every((c) => dados[c].length === 0);
      if (vazio) return false;
      const ultimo = this.listaBackups()[0];
      if (ultimo && ultimo.dia === N.hoje()) return false;
      if (ultimo && ultimo.hash === N.hashDados(dados)) return false;
      await this.criarBackup('automático');

    },

    /** Troca TODOS os dados pelos de `novos` (já validados), em lotes. Faz um backup antes. */
    async substituirTudo(novos, aoAvancar) {

      if (COLS.some((c) => atual[c].length)) await this.criarBackup('antes de substituir os dados');
      const ops = [];
      for (const c of SIMPLES) {
        const novosIds = new Set((novos[c] || []).map((x) => x.id));
        for (const x of atual[c]) if (!novosIds.has(x.id)) ops.push((b) => b.delete(this.raiz.collection(c).doc(x.id)));
        for (const x of novos[c] || []) ops.push((b) => b.set(this.raiz.collection(c).doc(x.id), limpar(x)));

      for (const [mes, itens] of Object.entries(grupos)) ops.push((b) => b.set(this.raiz.collection('lancamentos_mes').doc(mes), { itens }));

    },
  };
