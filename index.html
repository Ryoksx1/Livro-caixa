  function modalAntecipar(p, quitar, pai) {
    const c = C();
    const k = c.cartoes.get(p.cartaoId);
    const fa = mesFaturaAtual(k);
    const fut = N.parcelasFuturas(p, k, fa);
    abrirModal({
      titulo: quitar ? 'Quitar compra parcelada' : 'Antecipar parcelas',
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:16px">
        <div class="previa">${fut.length} parcela${fut.length > 1 ? 's' : ''} ainda a faturar (${brl(N.soma(fut, (x) => x.valor))}). Elas vão para a fatura atual do ${esc(k.nome)}: ${N.nomeMes(fa, true)}.</div>
        <div class="campos">${quitar ? '' : `<label class="campo"><span>Quantas parcelas antecipar</span><select id="an-qtd">${fut.map((_, i) => opt(String(i + 1), `${i + 1} (as últimas)`, i === 0)).join('')}</select></label>`}
        <label class="campo campo-valor${quitar ? ' largo' : ''}" style="grid-column:auto"><span>Desconto obtido</span><div class="prefixo"><input id="an-desc" inputmode="decimal" placeholder="0,00" style="height:40px;font-size:15px"></div></label></div>
        <div class="previa" id="an-previa"></div><div class="erro-campo"></div></form>`,
      rodape: rodapeForm('', quitar ? 'Quitar' : 'Antecipar'),
      aoMontar: (v) => {
        const calc = () => {
          const qtd = quitar ? fut.length : Number($('#an-qtd', v).value);
          const desc = N.paraCentavos($('#an-desc', v).value) || 0;
          const alvo = fut.slice(fut.length - qtd);
          const soma = N.soma(alvo, (x) => x.valor);
          return { qtd, desc, soma, liquido: Math.max(0, soma - desc) };
        };
        const sync = () => { const x = calc(); $('#an-previa', v).textContent = `Entra na fatura de ${N.nomeMes(fa)}: ${brl(x.liquido)}${x.desc ? ` (${brl(x.soma)} menos ${brl(Math.min(x.desc, x.soma))} de desconto)` : ''}.`; };
        v.addEventListener('input', sync); v.addEventListener('change', sync); sync();
        ligarEnvio(v, async () => {
          const x = calc();
          if (x.desc > x.soma) return 'O desconto não pode ser maior que o valor das parcelas.';
          const novo = N.antecipar(p, k, x.qtd, fa, x.desc);
          const ok = await gravar('parcelamentos', novo);
          if (ok) { toast(quitar ? 'Compra quitada' : `${x.qtd} parcela${x.qtd > 1 ? 's' : ''} antecipada${x.qtd > 1 ? 's' : ''}`); if (pai) fecharModal(pai); }
          return ok;
        });
      },
    });
  }

  // ---------- metas ----------

      titulo: m ? 'Editar meta' : 'Nova meta',

        <label class="campo"><span>Nome</span><input id="mt-nome" maxlength="50" autofocus placeholder="Ex.: Reserva de emergência" value="${esc(m ? m.nome : '')}"></label>
        ${valorCampo('mt-alvo', m ? m.alvo : '', 'Quanto quer juntar')}
        <div class="campos"><label class="campo"><span>Prazo (opcional)</span><input type="date" id="mt-prazo" value="${esc(m && m.prazo ? m.prazo : '')}"></label>
        <label class="campo campo-valor" style="grid-column:auto"><span>Já guardado antes</span><div class="prefixo"><input id="mt-ini" inputmode="decimal" placeholder="0,00" style="height:40px;font-size:15px" value="${m && m.valorInicial ? esc(N.paraTexto(m.valorInicial)) : ''}"></div></label></div>
        <span class="dica mudo" style="font-size:12.5px;margin-top:-8px">“Já guardado antes” é o que você já tinha separado e não quer lançar como depósito.</span>

      rodape: rodapeForm(m ? '<button type="button" class="botao perigo" data-x="excluir">Excluir</button>' : ''),

        if (bEx) bEx.onclick = async () => {
          const g = N.guardadoMeta(c.dados, m);
          if (await confirmar({ titulo: 'Excluir meta?', texto: `“${esc(m.nome)}” será excluída.${g ? ` Ela tem ${esc(brl(g))} guardados: o dinheiro não volta sozinho para as contas. Se quiser, faça uma retirada antes.` : ''} Os depósitos e retiradas continuam no histórico de lançamentos.`, botao: 'Excluir', perigo: true })) {
            if (await apagar('metas', m.id)) { fecharModal(v); toast('Meta excluída'); }
          }
        };
        ligarEnvio(v, async () => {
          const nome = $('#mt-nome', v).value.trim();
          const alvo = N.paraCentavos($('#mt-alvo', v).value);
          const iniTxt = $('#mt-ini', v).value.trim();
          const ini = iniTxt ? N.paraCentavos(iniTxt) : 0;
          const prazo = $('#mt-prazo', v).value || null;
          if (!nome) return 'Dê um nome para a meta.';
          if (!(alvo > 0)) return 'Informe quanto quer juntar.';
          if (Number.isNaN(ini) || ini < 0) return 'O valor já guardado não está num formato válido.';
          if (prazo && !N.dataValida(prazo)) return 'Informe um prazo válido.';
          const doc = { ...(m || { id: D.novoId('mt'), criadoEm: new Date().toISOString() }), nome, alvo, prazo, valorInicial: ini, cor: Number(radio(v, 'mt-cor') || 0) };
          const ok = await gravar('metas', doc);
          if (ok) toast(m ? 'Meta atualizada' : 'Meta criada');

        });
      },
    });
  }
  function modalMovMeta(m, sentido) {
    const c = C();
    const guardado = N.guardadoMeta(c.dados, m);
    const entrada = sentido === 'entrada';
    abrirModal({
      titulo: `${entrada ? 'Depositar em' : 'Retirar de'} ${esc(m.nome)}`,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:16px">
        ${valorCampo('mv-valor', '', 'Valor', 'autofocus')}
        <div class="campos"><label class="campo"><span>${entrada ? 'Sai da conta' : 'Volta para a conta'}</span><select id="mv-conta">${opcoesContas(c, c.contasAtivas[0] && c.contasAtivas[0].id, entrada ? 'Nenhuma: só registrar na meta' : 'Nenhuma: só registrar a retirada')}</select></label>
        <label class="campo"><span>Data</span><input type="date" id="mv-data" value="${N.hoje()}"></label></div>
        <p class="mudo" style="font-size:12.5px;margin:0">${entrada ? 'O valor sai do saldo da conta e vai para a meta. Não conta como despesa.' : `Guardado nesta meta: ${brl(guardado)}. O valor volta para o saldo da conta escolhida.`}</p>
        <div class="erro-campo"></div></form>`,
      rodape: rodapeForm('', entrada ? 'Depositar' : 'Retirar'),
      aoMontar: (v) => ligarEnvio(v, async () => {

        const data = $('#mv-data', v).value;

        if (!entrada && valor > guardado) return `A meta tem ${brl(guardado)} guardados. Não dá para retirar mais que isso.`;
        if (!N.dataValida(data)) return 'Informe uma data válida.';
        const doc = { id: D.novoId('mv'), tipo: 'transferencia', valor, descricao: `${entrada ? 'Depósito' : 'Retirada'}: ${m.nome}`, metaId: m.id, metaSentido: sentido, contaId: entrada ? conta : null, contaDestinoId: entrada ? null : conta, data, criadoEm: new Date().toISOString() };
        const ok = await gravar('lancamentos', doc);
        if (ok) toast(entrada ? `${brl(valor)} depositados` : `${brl(valor)} retirados`);
        return ok;
      }),
    });
  }

  // ---------- categorias ----------
  function modalCategoria(k) {
    const c = C();
    const usos = k ? c.dados.lancamentos.filter((l) => l.categoriaId === k.id).length + c.dados.recorrentes.filter((r) => r.categoriaId === k.id).length + c.dados.parcelamentos.filter((p) => p.categoriaId === k.id).length : 0;
    abrirModal({
      titulo: k ? 'Editar categoria' : 'Nova categoria',
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:16px">
        <label class="campo"><span>Nome</span><input id="cg-nome" maxlength="30" autofocus value="${esc(k ? k.nome : '')}" placeholder="Ex.: Pets"></label>
        <fieldset class="campo"><legend>Tipo</legend><div class="seg tipo"><label><input type="radio" name="cg-tipo" value="despesa"${!k || k.tipo === 'despesa' ? ' checked' : ''}${usos ? ' disabled' : ''}><span>Despesa</span></label><label><input type="radio" name="cg-tipo" value="receita"${k && k.tipo === 'receita' ? ' checked' : ''}${usos ? ' disabled' : ''}><span>Receita</span></label></div>${usos ? '<span class="dica">Em uso: o tipo não pode mudar.</span>' : ''}</fieldset>
        <fieldset class="campo"><legend>Cor</legend>${seletorCor('cg-cor', k ? k.cor : c.dados.categorias.length % 8)}</fieldset>
        <div class="erro-campo"></div></form>`,
      rodape: rodapeForm(k ? '<button type="button" class="botao perigo" data-x="excluir">Excluir</button>' : ''),
      aoMontar: (v) => {
        const bEx = v.querySelector('[data-x=excluir]');
        if (bEx) bEx.onclick = () => excluirCategoria(k, usos, v);
        ligarEnvio(v, async () => {
          const nome = $('#cg-nome', v).value.trim();
          if (!nome) return 'Dê um nome para a categoria.';
          const doc = { ...(k || { id: D.novoId('cat'), ordem: 100 }), nome, tipo: k && usos ? k.tipo : radio(v, 'cg-tipo'), cor: Number(radio(v, 'cg-cor') || 0) };
          const ok = await gravar('categorias', doc);
          if (ok) toast(k ? 'Categoria atualizada' : 'Categoria criada');
          return ok;
        });
      },
    });
  }
  async function excluirCategoria(k, usos, pai) {
    const c = C();
    if (!usos) {
      if (await confirmar({ titulo: 'Excluir categoria?', texto: `“${esc(k.nome)}” será excluída.`, botao: 'Excluir', perigo: true })) {
        if (await apagar('categorias', k.id)) { if (c.orc.get(k.id)) await apagar('orcamentos', c.orc.get(k.id).id); fecharModal(pai); toast('Categoria excluída'); }
      }
      return;
    }
    const outras = c.categoriasDe(k.tipo).filter((x) => x.id !== k.id);
    excluirCategoria._destino = null;
    const ok = await confirmar({
      titulo: 'Excluir categoria em uso?', botao: 'Mover e excluir', perigo: true,
      texto: `“${esc(k.nome)}” está em ${usos} ${usos === 1 ? 'registro' : 'registros'}. Escolha para onde eles vão.`,
      extra: `<label class="campo" style="margin-top:12px"><span>Mover para</span><select id="cg-destino">${opt('', 'Sem categoria', true)}${outras.map((x) => opt(x.id, x.nome, false)).join('')}</select></label>`,
    });
    if (!ok) return;
    // o select some junto com o modal, então o destino é guardado no evento de mudança
    const destino = excluirCategoria._destino || null;
    excluirCategoria._destino = null;
    const tarefas = [];
    for (const l of c.dados.lancamentos.filter((x) => x.categoriaId === k.id)) tarefas.push(() => D.salvar('lancamentos', { ...l, categoriaId: destino }));
    for (const r of c.dados.recorrentes.filter((x) => x.categoriaId === k.id)) tarefas.push(() => D.salvar('recorrentes', { ...r, categoriaId: destino }));
    for (const p of c.dados.parcelamentos.filter((x) => x.categoriaId === k.id)) tarefas.push(() => D.salvar('parcelamentos', { ...p, categoriaId: destino }));
    try {
      await D.emLote(tarefas);
      if (c.orc.get(k.id)) await D.excluir('orcamentos', c.orc.get(k.id).id);
      await D.excluir('categorias', k.id);
      fecharModal(pai);
      toast(`Categoria excluída, ${usos} ${usos === 1 ? 'registro movido' : 'registros movidos'}`);
    } catch (e) { toast('A exclusão parou no meio: ' + D.mensagemErro(e) + ' Tente de novo para concluir.', { tipo: 'erro', ms: 8000 }); }
  }
  document.addEventListener('change', (e) => { if (e.target.id === 'cg-destino') excluirCategoria._destino = e.target.value || null; });

  // ---------- orçamento inline ----------
  async function salvarOrcamento(input) {
    const c = C();
    const catId = input.dataset.orc;
    const k = c.cat.get(catId);
    const atual = c.orc.get(catId);
    const txt = input.value.trim();
    if (!txt) {
      if (atual && await apagar('orcamentos', atual.id)) toast(`Limite de ${k.nome} removido`);
      return;
    }
    const v = N.paraCentavos(txt);
    if (!(v > 0)) { toast('Limite inválido. Use um valor como 800,00.', { tipo: 'erro' }); input.value = atual ? N.paraTexto(atual.limite) : ''; return; }
    if (atual && atual.limite === v) return;
    if (await gravar('orcamentos', { id: 'orc_' + catId, categoriaId: catId, limite: v })) toast(`Limite de ${k.nome}: ${brl(v)} por mês`);
  }

  // ---------- arquivos ----------
  function baixar(nome, conteudo) {
    try {
      const tipo = nome.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json;charset=utf-8';
      const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
      const a = document.createElement('a');
      a.href = url; a.download = nome; a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      toast('Arquivo baixado: ' + nome);
    } catch (e) { toast('Não foi possível baixar: ' + (e && e.message || 'erro'), { tipo: 'erro' }); }
  }
  const carimbo = () => N.hoje();
  function exportarCsv() { const c = C(); baixar(`livro-caixa-${carimbo()}.csv`, N.csv(c.dados, N.itens(c.dados, c.mesHoje, c.hoje))); }
  function exportarJson() { baixar(`livro-caixa-backup-${carimbo()}.json`, JSON.stringify(N.montarBackup(D.lista(), new Date().toISOString()), null, 1)); }
  function oferecerSubstituicao(v, origem) {
    if (!v.ok) {
      abrirModal({ titulo: 'Este arquivo não pode ser importado', fecharNoVeu: true, corpo: `<div class="aviso perigo">${v.erros.map(esc).join('<br>')}${v.totalErros > v.erros.length ? `<br>e mais ${v.totalErros - v.erros.length} problemas` : ''}</div><p class="mudo" style="margin:0;font-size:13px">Nada foi alterado.</p>`, rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Entendi</button></div>' });
      return;
    }
    const ct = v.contagem;
    const resumo = `${ct.lancamentos} lançamentos, ${ct.contas} contas, ${ct.cartoes} cartões, ${ct.categorias} categorias, ${ct.recorrentes} contas fixas, ${ct.parcelamentos} parcelamentos, ${ct.orcamentos} orçamentos e ${ct.metas} metas`;
    confirmar({
      titulo: origem === 'backup' ? 'Restaurar este backup?' : 'Importar este backup?', botao: 'Substituir meus dados', perigo: true,
      texto: `Os dados atuais serão <b>substituídos</b> por: ${resumo}.${v.exportadoEm ? ` Backup de ${esc(new Date(v.exportadoEm).toLocaleString('pt-BR'))}.` : ''}`,
      extra: '<div class="aviso" style="margin-top:12px">Antes de substituir, um backup dos dados atuais é guardado automaticamente. Você pode voltar a ele em Configurações.</div>',
    }).then(async (ok) => {
      if (!ok) return;
      const t = toast('Substituindo dados…', { ms: 600000 });
      try {
        await D.substituirTudo(v.dados, (f, total) => { t.firstChild.textContent = `Substituindo dados… ${f} de ${total}`; });
        t.remove();
        toast('Dados substituídos');
      } catch (e) {
        t.remove();
        toast('A substituição parou no meio: ' + D.mensagemErro(e) + ' Seus dados anteriores estão no backup mais recente.', { tipo: 'erro', ms: 12000 });
      }
    });
  }
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'importar-arquivo') return;
    const arq = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!arq) return;
    const leitor = new FileReader();
    leitor.onload = () => {
      let obj;
      try { obj = JSON.parse(String(leitor.result)); } catch (err) { oferecerSubstituicao({ ok: false, erros: ['O arquivo não é um JSON válido.'] }); return; }
      oferecerSubstituicao(N.validarBackup(obj), 'arquivo');
    };
    leitor.onerror = () => toast('Não foi possível ler o arquivo.', { tipo: 'erro' });
    leitor.readAsText(arq);
  });

  function apagarTudo() {
    abrirModal({
      titulo: 'Apagar todos os dados?',
      corpo: `<p style="margin:0;color:var(--ink-2)">Todos os lançamentos, contas, cartões, contas fixas, parcelamentos, orçamentos, metas e categorias serão removidos. Um backup é guardado antes e pode ser restaurado em Configurações.</p>
        <label class="campo"><span>Para confirmar, digite APAGAR</span><input id="ap-conf" autocomplete="off" autofocus></label><div class="erro-campo"></div>`,
      rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Cancelar</button><button type="button" class="botao perigo cheio" data-salvar>Apagar tudo</button></div>',
      aoMontar: (v) => ligarEnvio(v, async () => {
        if ($('#ap-conf', v).value.trim().toUpperCase() !== 'APAGAR') return 'Digite APAGAR para confirmar.';
        const t = toast('Apagando…', { ms: 600000 });
        try {
          await D.substituirTudo(Object.fromEntries(N.COLECOES.map((c) => [c, []])), (f, total) => { t.firstChild.textContent = `Apagando… ${f} de ${total}`; });
          await D.salvarFin({ categoriasCriadas: false });
          t.remove();
          toast('Dados apagados. O backup está em Configurações.');
          return true;
        } catch (e) { t.remove(); return 'Parou no meio: ' + D.mensagemErro(e); }
      }),
    });
  }

  // ====================================================================
  // AÇÕES (delegação de cliques)
  // ====================================================================
  function irPara(aba) { S.aba = aba; pref.gravar('aba', aba); window.scrollTo(0, 0); render(); }
  function abrirItem(id, fonte) {
    const c = C();
    if (fonte === 'transf') {
      const l = c.dados.lancamentos.find((x) => x.id === id);
      if (!l) return;
      if (l.faturaCartaoId) return modalFatura(l.faturaCartaoId, l.faturaMes);
      if (l.metaId) {
        return confirmar({ titulo: l.metaSentido === 'saida' ? 'Retirada da meta' : 'Depósito na meta', texto: `${esc(l.descricao)}, ${esc(brl(l.valor))} em ${N.dataLonga(l.data)}. Excluir este movimento desfaz o efeito na meta e na conta.`, botao: 'Excluir movimento', perigo: true })
          .then(async (ok) => { if (ok && await apagar('lancamentos', l.id)) toast('Movimento excluído'); });
      }
      return formTransferencia(l);
    }
    const it = c.itens.find((x) => x.id === id);
    if (!it) return;
    if (it.fonte === 'parcela') return modalParcelamento(c.parcs.get(it.parcelamentoId));
    formLancamento({ item: it });
  }
  const ACOES = {
    aba: (d) => irPara(d.aba),
    'mais-abas': () => abrirModal({
      titulo: 'Mais', fecharNoVeu: true,
      corpo: `<div class="mais-abas">${ABAS.filter((a) => !NO_CELULAR.includes(a.id)).map((a) => `<button type="button" data-ir="${a.id}">${ic(a.icone)}${a.nome}</button>`).join('')}</div>`,
      aoMontar: (v) => v.addEventListener('click', (e) => { const b = e.target.closest('[data-ir]'); if (b) { fecharModal(v); irPara(b.dataset.ir); } }),
    }),
    'mes-ant': () => { S.mes = N.addMes(S.mes, -1); render(); },
    'mes-prox': () => { S.mes = N.addMes(S.mes, 1); render(); },
    'mes-hoje': () => { S.mes = N.mesDe(N.hoje()); render(); },
    novo: () => formLancamento(),
    abrir: (d) => abrirItem(d.id, d.fonte),
    pagar: (d) => marcarPago(d.id),
    'nova-conta': () => modalConta(),
    'editar-conta': (d) => modalConta(C().contas.get(d.id)),
    'novo-cartao': () => modalCartao(),
    'editar-cartao': (d) => modalCartao(C().cartoes.get(d.id)),
    'ver-fatura': (d) => modalFatura(d.cartao, d.mes),
    'pagar-fatura': (d) => modalPagarFatura(d.cartao, d.mes),
    transferir: () => formLancamento({ tipo: 'transferencia' }),
    extrato: (d) => { S.filtros = { ...FILTROS_PADRAO, onde: d.onde, periodo: 'tudo' }; irPara('lancamentos'); },
    'ver-abertos': () => { S.filtros = { ...FILTROS_PADRAO, sit: 'aberto', periodo: 'tudo', ordem: 'data-asc' }; irPara('lancamentos'); },
    'ver-arquivadas': () => { S.verArquivadas = !S.verArquivadas; render(); },
    'ver-concluidos': () => { S.verConcluidos = !S.verConcluidos; render(); },
    'nova-fixa': () => modalRecorrente(),
    'editar-fixa': (d) => modalRecorrente(C().recs.get(d.id)),
    'novo-parcelamento': () => modalParcelamento(),
    'editar-parcelamento': (d) => modalParcelamento(C().parcs.get(d.id)),
    'nova-meta': () => modalMeta(),
    'editar-meta': (d) => modalMeta(C().metas.get(d.id)),
    'mov-meta': (d) => modalMovMeta(C().metas.get(d.id), d.sentido),
    'nova-categoria': () => modalCategoria(),
    'editar-categoria': (d) => modalCategoria(C().cat.get(d.id)),
    'filtros-abrir': () => { S.filtrosAbertos = !S.filtrosAbertos; render(); },
    'filtros-limpar': () => { S.filtros = { ...FILTROS_PADRAO }; render(); },
    'exportar-csv': exportarCsv,
    'exportar-json': exportarJson,
    'backup-agora': async () => { const t = toast('Fazendo backup…', { ms: 60000 }); try { await D.criarBackup('manual'); t.remove(); toast('Backup feito'); } catch (e) { t.remove(); toast('Backup não foi feito: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    'baixar-backup': async (d) => { const b = D.backups.get(d.id); if (!b) return; try { const obj = await D.lerBackup(b); baixar(`livro-caixa-backup-${(b.criadoEm || '').slice(0, 10)}.json`, JSON.stringify(obj, null, 1)); } catch (e) { toast('Não foi possível ler o backup: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    'restaurar-backup': async (d) => { const b = D.backups.get(d.id); if (!b) return; try { oferecerSubstituicao(N.validarBackup(await D.lerBackup(b)), 'backup'); } catch (e) { toast('Não foi possível ler o backup: ' + D.mensagemErro(e), { tipo: 'erro' }); } },
    'apagar-tudo': apagarTudo,
    entrar: async () => { try { await D.entrar(); } catch (e) { D.erroLogin = D.mensagemErro(e); render(); } },
    sair: async () => { if (await confirmar({ titulo: 'Sair da conta?', texto: 'Seus dados continuam guardados na nuvem. Para ver de novo, é só entrar com a mesma conta Google.', botao: 'Sair' })) { try { await D.sair(); } catch (e) { toast('Não foi possível sair: ' + D.mensagemErro(e), { tipo: 'erro' }); } } },
    recarregar: () => location.reload(),
  };
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-acao]');
    if (!a || a.disabled) return;
    const fn = ACOES[a.dataset.acao];
    if (fn) { e.preventDefault(); fn(a.dataset, a); }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.linha[data-acao]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.orc) { e.preventDefault(); e.target.blur(); }
  });

  // filtros e campos da tela
  let tBusca = null;
  document.addEventListener('input', (e) => {
    if (e.target.id === 'f-busca') { S.filtros.busca = e.target.value; clearTimeout(tBusca); tBusca = setTimeout(render, 160); }
  });
  const MAPA_FILTROS = { 'f-periodo': 'periodo', 'f-tipo': 'tipo', 'f-cat': 'cat', 'f-onde': 'onde', 'f-forma': 'forma', 'f-sit': 'sit', 'f-ordem': 'ordem', 'f-de': 'de', 'f-ate': 'ate' };
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (MAPA_FILTROS[t.id]) { S.filtros[MAPA_FILTROS[t.id]] = t.value; render(); return; }
    if (t.dataset && t.dataset.orc) { salvarOrcamento(t); return; }
    if (t.id === 'comp-a') { S.compA = t.value; render(); return; }
    if (t.id === 'comp-b') { S.compB = t.value; render(); return; }
    if (t.name === 'tema') { pref.gravar('tema', t.value); aplicarTema(); }
  });

  // ---------- tema ----------
  const temaHost = document.documentElement.getAttribute('data-theme');
  function aplicarTema() {
    const t = pref.ler('tema', 'auto');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else if (temaHost) document.documentElement.setAttribute('data-theme', temaHost);
    else document.documentElement.removeAttribute('data-theme');
    setTimeout(desenharGraficos, 0);
  }

  // ====================================================================
  // INÍCIO
  // ====================================================================
  $('[data-acao="mes-ant"]').innerHTML = ic('esq');
  $('[data-acao="mes-prox"]').innerHTML = ic('dir');
  $('#fab').innerHTML = ic('mais') + '<span>Lançar</span>';
  aplicarTema();
  render();

  let semeando = false, backupFeito = false, tCarga = null;
  async function aoMudarDados() {
    if (S.status === 'carregando' && D.usuario && D.erroInicial) S.status = 'erro';
    if (S.status === 'carregando' && D.usuario && (D.pronto || D.exibivel)) S.status = 'ok';
    _cache = null;
    render();
    if (!D.pronto) return;
    if (!semeando && !(D.fin && D.fin.categoriasCriadas)) {
      semeando = true;
      try {
        for (const [id, nome, tipo, corSlot] of CATS_PADRAO) {
          if (!D.estado.categorias.has(id)) await D.salvar('categorias', { id, nome, tipo, cor: corSlot, ordem: CATS_PADRAO.findIndex((x) => x[0] === id) });
        }
        await D.salvarFin({ categoriasCriadas: true });
      } catch (e) { console.warn('categorias padrão', e); } finally { semeando = false; }
    }
    if (!backupFeito) {
      backupFeito = true;
      D.backupDiario().catch((e) => console.warn('backup diário', e));
    }
  }
  D.ouvir(aoMudarDados);
  D.ouvirConta((u) => {
    semeando = false; backupFeito = false; _cache = null;
    clearTimeout(tCarga);
    pilha.slice().forEach((v) => fecharModal(v));
    if (!u) { S.status = 'login'; render(); return; }
    S.status = 'carregando';
    render();
    // sem internet num aparelho novo, mostra o que houver depois de alguns segundos
    tCarga = setTimeout(() => { if (S.status === 'carregando') { S.status = 'ok'; render(); } }, 8000);
  });
  D.aoErroTardio = (e) => toast('Uma gravação feita sem internet foi recusada pelo servidor: ' + D.mensagemErro(e), { tipo: 'erro', ms: 10000 });
  addEventListener('offline', () => toast('Sem internet. O que você lançar fica guardado neste aparelho e é enviado quando a conexão voltar.', { ms: 7000 }));
  addEventListener('online', () => toast('Conexão de volta. Sincronizando.'));
  try {
    if (!D.iniciar(window.firebase, window.FIREBASE_CONFIG)) { S.status = 'sem-config'; render(); }
  } catch (e) { console.error(e); D.erroInicial = D.mensagemErro(e); S.status = 'erro'; render(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
