    return `<div class="troca-cor">${[0, 1, 2, 3, 4, 5, 6, 7, 8].map((i) => `<label><input type="radio" name="${nome}" value="${i}"${atual === i ? ' checked' : ''} aria-label="Cor ${i + 1}"><span style="background:${cor(i)}"></span></label>`).join('')}</div>`;
  }
  const valorCampo = (id, valor, rotulo = 'Valor', extra = '') =>
    `<label class="campo campo-valor largo"><span>${rotulo}</span><div class="prefixo"><input id="${id}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${valor != null && valor !== '' ? esc(N.paraTexto(valor)) : ''}" ${extra}></div></label>`;
  const rodapeForm = (esquerda, salvar = 'Salvar') =>
    `${esquerda || ''}<div class="dir"><button type="button" class="botao" data-fechar>Cancelar</button><button type="submit" class="botao primario" data-salvar>${salvar}</button></div>`;
  /** Liga o botão Salvar do rodapé ao envio, com trava enquanto grava. */
  function ligarEnvio(veu, fn) {
    const b = veu.querySelector('[data-salvar]');
    const form = veu.querySelector('form');
    const enviar = async (e) => {
      if (e) e.preventDefault();
      if (b.disabled) return;
      const erro = veu.querySelector('.erro-campo');
      if (erro) erro.textContent = '';
      b.disabled = true;
      try {
        const r = await fn();
        if (typeof r === 'string') { if (erro) erro.textContent = r; else toast(r, { tipo: 'erro' }); }
        else if (r !== false) fecharModal(veu);
      } finally { b.disabled = false; }
    };
    b.onclick = enviar;
    if (form) form.addEventListener('submit', enviar);
  }
  const radio = (veu, nome) => (veu.querySelector(`input[name="${nome}"]:checked`) || {}).value;

  // ---------- renderização ----------
  let agendado = false;
  function render() {
    if (agendado) return;
    agendado = true;
    setTimeout(() => { agendado = false; renderAgora(); }, 0);
  }
  function renderNav() {
    const lateral = ABAS.map((a) => `<button type="button" class="nav-item" data-acao="aba" data-aba="${a.id}"${S.aba === a.id ? ' aria-current="page"' : ''}>${ic(a.icone)}<span>${a.nome}</span></button>`).join('');
    $('#nav-lateral').innerHTML = lateral;
    const inf = ABAS.filter((a) => NO_CELULAR.includes(a.id)).map((a) => `<button type="button" data-acao="aba" data-aba="${a.id}"${S.aba === a.id ? ' aria-current="page"' : ''}>${ic(a.icone)}<span>${a.curto}</span></button>`).join('')
      + `<button type="button" data-acao="mais-abas"${NO_CELULAR.includes(S.aba) ? '' : ' aria-current="page"'}>${ic('pontos')}<span>Mais</span></button>`;
    $('#nav-inferior').innerHTML = inf;
    $('#rodape-lateral').innerHTML = chipUsuario();
  }
  function renderAgora() {
    const aba = ABAS.find((a) => a.id === S.aba);
    renderNav();
    $('#titulo-aba').textContent = aba.nome;
    $('#seletor-mes').hidden = !aba.mes || S.status !== 'ok';
    const rotMes = N.nomeMes(S.mes, true);
    $('#rotulo-mes').textContent = rotMes.charAt(0).toUpperCase() + rotMes.slice(1);
    $('.seletor-mes .hoje').hidden = S.mes === N.mesDe(N.hoje());
    $('#fab').hidden = S.status !== 'ok';
    document.body.classList.toggle('fora', S.status === 'login' || S.status === 'sem-config' || S.status === 'erro');
    const el = $('#conteudo');
    if (S.status === 'carregando') { el.innerHTML = `<div class="tela-centro"><div><div class="carregando"></div><p>Abrindo seu livro-caixa…</p></div></div>`; return; }
    if (S.status === 'login') { el.innerHTML = telaLogin(); return; }
    if (S.status === 'sem-config' || S.status === 'erro') { el.innerHTML = telaErro(); return; }
    const foco = guardarFoco();
    try { el.innerHTML = VISOES[S.aba](); } catch (e) { console.error(e); el.innerHTML = `<div class="aviso perigo">Esta tela teve um erro ao abrir: ${esc(e.message)}</div>`; }
    restaurarFoco(foco);
    desenharGraficos();
  }
  function guardarFoco() {
    const a = document.activeElement;
    if (!a || !a.id || !$('#conteudo').contains(a)) return null;
    return { id: a.id, valor: a.value, ini: a.selectionStart, fim: a.selectionEnd };
  }
  function restaurarFoco(f) {
    if (!f) return;
    const el = document.getElementById(f.id);
    if (!el) return;
    if (typeof f.valor === 'string' && el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio') el.value = f.valor;
    el.focus();
    try { if (f.ini != null) el.setSelectionRange(f.ini, f.fim); } catch (e) { /* campo sem seleção */ }
  }
  function telaErro() {
    if (S.status === 'sem-config') {
      return `<div class="tela-centro"><div><h2>Site ainda não configurado</h2><p>Este site ainda não foi ligado ao Firebase. Quem mantém o site precisa preencher o arquivo config.js.</p></div></div>`;
    }
    return `<div class="tela-centro"><div><h2>Não foi possível abrir seus dados</h2><p>${esc(D.erroInicial || 'Erro desconhecido.')}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="botao primario" data-acao="recarregar">Tentar de novo</button><button type="button" class="botao" data-acao="sair">Sair da conta</button></div></div></div>`;
  }
  const G_LOGO = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  function telaLogin() {
    return `<div class="tela-login"><div class="cartao-login">
      <div class="marca" style="padding:0"><div class="marca-selo">R$</div><b>Livro-Caixa</b></div>
      <h2>Suas finanças em ordem, no celular e no computador</h2>
      <p>Contas, cartões e faturas, contas fixas, parcelamentos, orçamentos e metas, num lugar só. Entre com sua conta Google: seu livro-caixa começa em branco e é só seu.</p>
      <button type="button" class="botao entrar" data-acao="entrar">${G_LOGO}<span>Entrar com Google</span></button>
      ${D.erroLogin ? `<div class="erro-campo">${esc(D.erroLogin)}</div>` : ''}
      <p class="letra-miuda">Seus dados ficam guardados na nuvem do Google (Firebase), no projeto de quem mantém este site. Nenhum outro usuário consegue ver o que você lança.</p>
    </div></div>`;
  }
  function chipUsuario() {
    const u = D.usuario;
    if (!u) return '';
    const inicial = esc((u.nome || u.email || '?').trim().charAt(0).toUpperCase());
    const foto = u.foto ? `<img src="${esc(u.foto)}" alt="" referrerpolicy="no-referrer">` : `<span>${inicial}</span>`;
    return `<div class="usuario"><div class="avatar">${foto}</div><div class="quem"><strong>${esc(u.nome || 'Você')}</strong><small>${esc(u.email)}</small></div><button type="button" class="botao fantasma peq" data-acao="sair">Sair</button></div>`;
  }

  // ---------- pílulas e pequenos pedaços ----------
  const pill = (sit, tipo) => `<span class="pill ${sit}">${esc((tipo === 'receita' && SIT_RECEITA[sit]) || SIT[sit] || sit)}</span>`;
  const pillFatura = (st) => `<span class="pill ${st}">${ST_FATURA[st]}</span>`;
  function variacao(atual, anterior, sobeEhBom) {
    if (!anterior) return '';
    const p = (atual - anterior) / Math.abs(anterior);
    if (Math.abs(p) < 0.005) return '<span class="var igual">= mês anterior</span>';
    const bom = sobeEhBom ? p > 0 : p < 0;
    return `<span class="var ${bom ? 'bom' : 'ruim'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 })}%</span>`;
  }
  const valorComSinal = (tipo, v) => tipo === 'receita' ? `<span class="pos">+${brl(v)}</span>` : tipo === 'despesa' ? `<span>−${brl(v).replace('-', '')}</span>` : `<span class="mudo">${brl(v)}</span>`;
  const barra = (pct, nivel) => `<div class="barra ${nivel || ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(1, pct) * 100)}"><i style="width:${Math.max(0, Math.min(1, pct)) * 100}%"></i></div>`;
  const pct = (x) => `${(x * 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 })}%`;

  // ====================================================================
  // DASHBOARD
  // ====================================================================
  function vPainel() {
    const c = C();
    const p = N.painel(c.dados, c.itens, S.mes, c.hoje);
    const guardadoMetas = N.soma(c.dados.metas, (m) => N.guardadoMeta(c.dados, m));
    const pendDesp = p.pendencias.filter((x) => x.tipo === 'despesa');
    const atrasadas = pendDesp.filter((x) => x.atrasado).length;
    let h = '';
    if (!c.dados.contas.length) {
      h += `<section class="boas-vindas"><div><h2>Seu livro-caixa está pronto</h2>
        <p>Comece cadastrando onde seu dinheiro fica. Depois, registre cada gasto ou entrada pelo botão de lançamento. Os dados ficam guardados na sua conta, visíveis só para você.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="botao primario" data-acao="nova-conta">Criar primeira conta</button><button type="button" class="botao" data-acao="novo-cartao">Cadastrar cartão</button></div></div>
        <ol class="passos"><li><span><b>Contas</b>: banco, carteira digital ou dinheiro, com o saldo de hoje.</span></li>
        <li><span><b>Lançamentos</b>: o que entrou e o que saiu, pago ou a pagar.</span></li>
        <li><span><b>Contas fixas e parcelas</b>: aluguel, assinaturas e compras parceladas aparecem sozinhas em cada mês.</span></li></ol></section>`;
    }
    const fim = N.dataCurta(N.fimDoMes(S.mes));
    h += `<section class="kpis" aria-label="Resumo">
      <div class="kpi destaque"><span class="rotulo-mini">Saldo atual</span><span class="valor">${brl(p.saldoAtual)}</span><span class="det">${c.dados.contas.length} ${c.dados.contas.length === 1 ? 'conta' : 'contas'}${guardadoMetas ? ` · ${brl(guardadoMetas)} guardado em metas` : ''}</span></div>
      <div class="kpi"><span class="rotulo-mini">Saldo previsto</span><span class="valor ${p.saldoPrevisto < 0 ? 'neg' : ''}">${brl(p.saldoPrevisto)}</span><span class="det">até ${fim}, depois de pagar e receber o que falta</span></div>
      <div class="kpi"><span class="rotulo-mini">Despesas pendentes</span><span class="valor">${brl(p.despesasPendentes)}</span><span class="det">${pendDesp.length} a pagar${atrasadas ? ` · <b style="color:var(--late)">${atrasadas} atrasada${atrasadas > 1 ? 's' : ''}</b>` : ''}</span></div>
      <div class="kpi"><span class="rotulo-mini">Receitas do mês</span><span class="valor pos">${brl(p.atual.receitas)}</span><span class="det">recebido ${brl(p.atual.receitasRecebidas)} ${variacao(p.atual.receitas, p.anterior.receitas, true)}</span></div>
      <div class="kpi"><span class="rotulo-mini">Despesas do mês</span><span class="valor">${brl(p.atual.despesas)}</span><span class="det">pago ${brl(p.atual.despesasPagas)} ${variacao(p.atual.despesas, p.anterior.despesas, false)}</span></div>
    </section>`;

    // vencimentos próximos e atrasados (relativos a hoje)
    const pendHoje = N.pendencias(c.dados, c.itens, N.addMes(c.mesHoje, 1), c.hoje)
      .filter((x) => x.atrasado || x.vencimento <= N.addDias(c.hoje, 7))
      .sort((a, b) => (a.vencimento < b.vencimento ? -1 : 1));
    const linhasPend = pendHoje.slice(0, 7).map((x) => {
      if (x.fatura) {
        return `<div class="item-simples clicavel" data-acao="ver-fatura" data-cartao="${esc(x.cartao.id)}" data-mes="${x.fatura.mes}">
          <div class="esq"><span class="tarja" style="background:${cor(x.cartao.cor)}"></span><div><strong>Fatura ${esc(x.cartao.nome)}</strong><small>vence ${N.dataCurta(x.vencimento)}</small></div></div>
          <div class="dir">${pillFatura(x.fatura.status)}<b class="num">${brl(x.valor)}</b></div></div>`;
      }
      const it = x.item;
      return `<div class="item-simples clicavel" data-acao="abrir" data-id="${esc(it.id)}">
        <div class="esq"><span class="ponto" style="background:${corCat(c, it.categoriaId)}"></span><div><strong>${esc(it.descricao || nomeCat(c, it.categoriaId))}</strong><small>${it.tipo === 'receita' ? 'receber' : 'vence'} ${N.dataCurta(x.vencimento)} · ${esc(nomeOnde(c, it))}</small></div></div>
        <div class="dir">${pill(it.situacao, it.tipo)}<b class="num">${valorComSinal(it.tipo, it.valor)}</b><button type="button" class="acao-rapida" data-acao="pagar" data-id="${esc(it.id)}" aria-label="Marcar como ${it.tipo === 'receita' ? 'recebido' : 'pago'}">${ic('check')}</button></div></div>`;
    }).join('');
    const faturas = c.cartoesAtivos.map((k) => {
      const f = N.fatura(c.dados, c.itens, k, S.mes, c.hoje);
      return `<div class="item-simples clicavel" data-acao="ver-fatura" data-cartao="${esc(k.id)}" data-mes="${S.mes}">
        <div class="esq"><span class="tarja" style="background:${cor(k.cor)}"></span><div><strong>${esc(k.nome)}</strong><small>fecha ${N.dataCurta(f.fechamento)} · vence ${N.dataCurta(f.vencimento)}</small></div></div>
        <div class="dir">${pillFatura(f.status)}<b class="num">${brl(f.total)}</b></div></div>`;
    }).join('');
    h += `<section class="grade-2">
      <div class="painel"><div class="painel-cab"><h2>A vencer em 7 dias e atrasados</h2>${pendHoje.length ? `<button type="button" class="botao fantasma peq" data-acao="ver-abertos">Ver tudo</button>` : ''}</div>
        ${linhasPend || `<div class="vazio"><strong>Nada vencendo nos próximos 7 dias</strong><span>Contas pendentes aparecem aqui antes do vencimento.</span></div>`}
        ${pendHoje.length > 7 ? `<p class="mudo" style="margin:8px 0 0;font-size:13px">e mais ${pendHoje.length - 7}</p>` : ''}</div>
      <div class="painel"><div class="painel-cab"><h2>Faturas de ${N.nomeMes(S.mes)}</h2><button type="button" class="botao fantasma peq" data-acao="aba" data-aba="contas">Cartões</button></div>
        ${faturas || `<div class="vazio"><strong>Nenhum cartão cadastrado</strong><button type="button" class="botao peq" data-acao="novo-cartao">Cadastrar cartão</button></div>`}</div>
    </section>`;

    // orçamento + evolução
    const cats = c.categoriasDe('despesa').filter((k) => c.orc.get(k.id)?.limite > 0).map((k) => {
      const gasto = p.atual.porCategoria.get(k.id) || 0;
      const lim = c.orc.get(k.id).limite;
      return { k, gasto, lim, p: gasto / lim, nivel: N.nivelOrcamento(gasto, lim) };
    }).sort((a, b) => b.p - a.p);
    const orc = cats.slice(0, 6).map((x) => `<div class="orc" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);padding:9px 0">
        <div class="nome"><span class="ponto" style="background:${cor(x.k.cor)}"></span><span>${esc(x.k.nome)}</span></div>
        <div class="prog"><div class="info"><span><b>${brl(x.gasto)}</b> de ${brl(x.lim)}</span>${x.nivel !== 'ok' ? `<span class="pill ${x.nivel}">${x.nivel === 'estourado' ? 'Acima do limite' : pct(x.p)}</span>` : `<span>${pct(x.p)}</span>`}</div>${barra(x.p, x.nivel)}</div></div>`).join('');
    h += `<section class="grade-2">
      <div class="painel"><div class="painel-cab"><h2>Orçamento de ${N.nomeMes(S.mes)}</h2><button type="button" class="botao fantasma peq" data-acao="aba" data-aba="orcamentos">Ajustar</button></div>
        ${orc || `<div class="vazio"><strong>Nenhum limite definido</strong><span>Defina quanto quer gastar por categoria e acompanhe aqui.</span><button type="button" class="botao peq" data-acao="aba" data-aba="orcamentos">Definir limites</button></div>`}</div>
      <div class="painel"><div class="painel-cab"><h2>Receitas e despesas, 6 meses</h2><button type="button" class="botao fantasma peq" data-acao="aba" data-aba="relatorios">Relatórios</button></div>
        <div class="grafico" data-grafico="barras" data-meses="6"></div>
        <div class="legenda"><span><i style="background:var(--pos)"></i>Receitas</span><span><i style="background:var(--neg)"></i>Despesas</span></div></div>
    </section>`;
    return h;
  }

  // ====================================================================
  // LANÇAMENTOS
  // ====================================================================
  const semAcento = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function dataListaDe(c, i) {
    if (i.fonte === 'parcela') { const k = c.cartoes.get(i.cartaoId); return k ? N.vencimentoDe(k, i.mes) : i.data; }
    if (i.cartaoId || i.tipo === 'transferencia') return i.data;
    return i.vencimento || i.data;
  }
  function itensFiltrados() {
    const c = C();
    const f = S.filtros;
    const transf = c.dados.lancamentos.filter((l) => l.tipo === 'transferencia').map((l) => ({ ...l, fonte: 'transf', mes: N.mesDe(l.data), situacao: 'pago' }));
    let lista = c.itens.concat(transf).map((i) => ({ ...i, dataLista: dataListaDe(c, i) }));
    if (f.periodo === 'mes') lista = lista.filter((i) => i.mes === S.mes);
    else if (f.periodo === 'tudo') lista = lista.filter((i) => (i.fonte !== 'virtual' && i.fonte !== 'parcela') || N.difMes(i.mes, c.mesHoje) >= 0);
    else {
      if (f.de) lista = lista.filter((i) => i.dataLista >= f.de);
      if (f.ate) lista = lista.filter((i) => i.dataLista <= f.ate);
      if (!f.ate) lista = lista.filter((i) => (i.fonte !== 'virtual' && i.fonte !== 'parcela') || N.difMes(i.mes, N.addMes(c.mesHoje, 12)) >= 0);
    }
    if (f.tipo) lista = lista.filter((i) => i.tipo === f.tipo);
    if (f.cat) lista = lista.filter((i) => (i.categoriaId || '') === (f.cat === '-' ? '' : f.cat) && i.tipo !== 'transferencia');
    if (f.onde) {
      const [k, id] = f.onde.split(':');
      lista = lista.filter((i) => (k === 'conta' ? (i.contaId === id || i.contaDestinoId === id) : (i.cartaoId === id || i.faturaCartaoId === id)));
    }
    if (f.forma) lista = lista.filter((i) => (i.cartaoId ? 'credito' : i.pagamento) === f.forma);
    if (f.sit) lista = lista.filter((i) => (f.sit === 'aberto' ? (i.situacao === 'pendente' || i.situacao === 'atrasado') : i.situacao === f.sit));
    if (f.busca.trim()) {
      const q = semAcento(f.busca.trim());
      lista = lista.filter((i) => semAcento(`${i.descricao} ${nomeCat(c, i.categoriaId)}`).includes(q));
    }
    const [campo, dir] = f.ordem.split('-');
    const s = dir === 'asc' ? 1 : -1;
    lista.sort((a, b) => (campo === 'valor' ? (a.valor - b.valor) * s : (a.dataLista < b.dataLista ? -1 : a.dataLista > b.dataLista ? 1 : 0) * s || (a.id < b.id ? -1 : 1)));
    return lista;
  }
  function linhaItem(c, i) {
    const d = i.dataLista;
    const meta = [];
    if (i.tipo === 'transferencia') {
      const de = i.contaId ? (c.contas.get(i.contaId) || {}).nome : (i.metaId ? 'Meta ' + ((c.metas.get(i.metaId) || {}).nome || 'excluída') : '');
      const para = i.contaDestinoId ? (c.contas.get(i.contaDestinoId) || {}).nome : i.faturaCartaoId ? 'Fatura ' + ((c.cartoes.get(i.faturaCartaoId) || {}).nome || '') + ' ' + N.nomeMes(i.faturaMes) : (i.metaId ? 'Meta ' + ((c.metas.get(i.metaId) || {}).nome || 'excluída') : '');
      meta.push(`<span>${esc(de || 'Fora das contas')} → ${esc(para || 'Fora das contas')}</span>`);
    } else {
      meta.push(`<span style="display:inline-flex;align-items:center;gap:5px"><span class="ponto" style="background:${corCat(c, i.categoriaId)}"></span>${esc(nomeCat(c, i.categoriaId))}</span>`);
      meta.push(`<span>${esc(nomeOnde(c, i))}</span>`);
      if (i.parcela) meta.push(`<span class="tag">Parcela ${i.parcela.num}/${i.parcela.de}${i.parcela.antecipada ? ' (antecipada)' : ''}</span>`);
      if (i.origem === 'recorrente') meta.push('<span class="tag">Conta fixa</span>');
      if (i.cartaoId) meta.push(`<span>Fatura ${N.nomeMes(i.mes)}</span>`);
      else if (i.pagamento && NOME_FORMA[i.pagamento]) meta.push(`<span>${NOME_FORMA[i.pagamento]}</span>`);
    }
    const titulo = i.descricao || (i.tipo === 'transferencia' ? 'Transferência' : nomeCat(c, i.categoriaId));
    const aberto = (i.situacao === 'pendente' || i.situacao === 'atrasado') && !i.cartaoId;
    return `<div class="linha${i.ignorada ? ' ignorada' : ''}" data-acao="abrir" data-id="${esc(i.id)}" data-fonte="${i.fonte}" role="button" tabindex="0">
      <div class="quando"><b>${d.slice(8, 10)}</b>${N.nomeMesCurto(N.mesDe(d))}</div>
      <div class="desc"><strong>${esc(titulo)}</strong><div class="meta">${meta.join('')}</div></div>
      <div class="lado"><span class="valor">${valorComSinal(i.tipo, i.valor)}</span>${i.tipo === 'transferencia' ? '<span class="pill vazia">Transferência</span>' : pill(i.situacao, i.tipo)}</div>
      <div class="acao-col">${aberto ? `<button type="button" class="acao-rapida" data-acao="pagar" data-id="${esc(i.id)}" aria-label="Marcar como ${i.tipo === 'receita' ? 'recebido' : 'pago'}" title="Marcar como ${i.tipo === 'receita' ? 'recebido' : 'pago'}">${ic('check')}</button>` : '<span class="espaco-acao"></span>'}</div>
    </div>`;
  }
  function vLancamentos() {
    const c = C();
    const f = S.filtros;
    const lista = itensFiltrados();
    const conta = lista.filter((i) => !i.ignorada);
    const rec = N.soma(conta.filter((i) => i.tipo === 'receita'), (i) => i.valor);
    const des = N.soma(conta.filter((i) => i.tipo === 'despesa'), (i) => i.valor);
    const optsCat = opt('', 'Todas', !f.cat) + opt('-', 'Sem categoria', f.cat === '-')
      + `<optgroup label="Despesas">${c.categoriasDe('despesa').map((k) => opt(k.id, k.nome, f.cat === k.id)).join('')}</optgroup>`
      + `<optgroup label="Receitas">${c.categoriasDe('receita').map((k) => opt(k.id, k.nome, f.cat === k.id)).join('')}</optgroup>`;
    const optsOnde = opt('', 'Todas', !f.onde)
      + (c.dados.contas.length ? `<optgroup label="Contas">${c.dados.contas.map((k) => opt('conta:' + k.id, k.nome, f.onde === 'conta:' + k.id)).join('')}</optgroup>` : '')
      + (c.dados.cartoes.length ? `<optgroup label="Cartões">${c.dados.cartoes.map((k) => opt('cartao:' + k.id, k.nome, f.onde === 'cartao:' + k.id)).join('')}</optgroup>` : '');
    const ativos = ['tipo', 'cat', 'onde', 'forma', 'sit'].filter((k) => f[k]).length + (f.periodo !== 'mes' ? 1 : 0);
    let h = `<section class="painel">
      <div class="filtros${S.filtrosAbertos ? ' abertos' : ''}" id="filtros">
        <label>Buscar<input id="f-busca" type="search" placeholder="Descrição ou categoria" value="${esc(f.busca)}" autocomplete="off"></label>
        <button type="button" class="botao btn-filtros" data-acao="filtros-abrir" aria-expanded="${S.filtrosAbertos}">Filtros${ativos ? ` (${ativos})` : ''}</button>
        <div class="mais">
          <label>Período<select id="f-periodo">${opt('mes', N.nomeMes(S.mes, true), f.periodo === 'mes')}${opt('tudo', 'Todo o histórico', f.periodo === 'tudo')}${opt('intervalo', 'Escolher datas', f.periodo === 'intervalo')}</select></label>
          <label>Tipo<select id="f-tipo">${opt('', 'Todos', !f.tipo)}${opt('despesa', 'Despesas', f.tipo === 'despesa')}${opt('receita', 'Receitas', f.tipo === 'receita')}${opt('transferencia', 'Transferências', f.tipo === 'transferencia')}</select></label>
          <label>Categoria<select id="f-cat">${optsCat}</select></label>
          <label>Conta ou cartão<select id="f-onde">${optsOnde}</select></label>
          ${f.periodo === 'intervalo' ? `<label>De<input id="f-de" type="date" value="${esc(f.de)}"></label><label>Até<input id="f-ate" type="date" value="${esc(f.ate)}"></label>` : ''}
          <label>Forma<select id="f-forma">${opt('', 'Todas', !f.forma)}${FORMAS.map(([v, t]) => opt(v, t, f.forma === v)).join('')}</select></label>
          <label>Situação<select id="f-sit">${opt('', 'Todas', !f.sit)}${opt('aberto', 'A pagar ou receber', f.sit === 'aberto')}${opt('atrasado', 'Atrasados', f.sit === 'atrasado')}${opt('pendente', 'Pendentes no prazo', f.sit === 'pendente')}${opt('pago', 'Pagos', f.sit === 'pago')}${opt('cartao', 'No cartão', f.sit === 'cartao')}${opt('pulado', 'Pulados', f.sit === 'pulado')}</select></label>
          <label>Ordenar<select id="f-ordem">${opt('data-desc', 'Mais recentes', f.ordem === 'data-desc')}${opt('data-asc', 'Mais antigos', f.ordem === 'data-asc')}${opt('valor-desc', 'Maior valor', f.ordem === 'valor-desc')}${opt('valor-asc', 'Menor valor', f.ordem === 'valor-asc')}</select></label>
          ${ativos || f.busca ? `<label>&nbsp;<button type="button" class="botao fantasma" data-acao="filtros-limpar" style="height:36px">Limpar filtros</button></label>` : ''}
        </div>
      </div>
    </section>`;
    h += `<section class="painel">`;
    if (!lista.length) {
      h += `<div class="vazio"><strong>${f.busca || ativos ? 'Nada encontrado com esses filtros' : `Nenhum lançamento em ${N.nomeMes(S.mes, true)}`}</strong>
        <span>${f.busca || ativos ? 'Tente outro termo ou limpe os filtros.' : 'Registre gastos e entradas pelo botão de lançamento.'}</span>
        ${f.busca || ativos ? '<button type="button" class="botao peq" data-acao="filtros-limpar">Limpar filtros</button>' : '<button type="button" class="botao primario peq" data-acao="novo">Novo lançamento</button>'}</div>`;
    } else {
      const LIM = 400;
      h += `<div class="linhas">${lista.slice(0, LIM).map((i) => linhaItem(c, i)).join('')}</div>`;
      if (lista.length > LIM) h += `<p class="mudo" style="font-size:13px">Mostrando ${LIM} de ${lista.length}. Use os filtros para refinar.</p>`;
      h += `<div class="rodape-lista"><span>${lista.length} ${lista.length === 1 ? 'item' : 'itens'}</span><span>Receitas <b class="pos">${brl(rec)}</b></span><span>Despesas <b>${brl(des)}</b></span><span>Resultado <b class="${rec - des < 0 ? 'neg' : 'pos'}">${brl(rec - des)}</b></span></div>`;
    }
    h += '</section>';
    return h;
  }

  // ====================================================================
  // CONTAS E CARTÕES
  // ====================================================================
  function vContas() {
    const c = C();
    const saldos = N.saldosContas(c.dados);
    const total = N.soma([...saldos.values()]);
    const arquivadas = c.dados.contas.filter((x) => x.arquivada);
    const nArquivados = arquivadas.length + c.dados.cartoes.filter((k) => k.arquivado).length;
    const ficha = (k) => {
      const s = saldos.get(k.id) || 0;
      return `<div class="ficha"><div class="ficha-cab"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="tarja" style="background:${cor(k.cor)}"></span><div style="min-width:0"><strong>${esc(k.nome)}</strong><small>${esc(NOME_TIPO_CONTA[k.tipo] || 'Conta')}${k.arquivada ? ' · arquivada' : ''}</small></div></div></div>
        <div class="grande ${s < 0 ? 'neg' : ''}">${brl(s)}</div>
        <div class="linha-info"><span>Saldo inicial</span><b>${brl(k.saldoInicial || 0)}</b></div>
        <div class="botoes"><button type="button" class="botao peq" data-acao="extrato" data-onde="conta:${esc(k.id)}">Extrato</button><button type="button" class="botao peq" data-acao="editar-conta" data-id="${esc(k.id)}">Editar</button></div></div>`;
    };
    let h = `<section class="secao-titulo"><div><h2>Contas</h2><span class="mudo" style="font-size:13px">Saldo somado: <b class="num" style="color:var(--ink)">${brl(total)}</b></span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="botao" data-acao="transferir"${c.contasAtivas.length < 2 ? ' disabled title="Cadastre duas contas para transferir"' : ''}>${ic('setas')}Transferir</button><button type="button" class="botao primario" data-acao="nova-conta">${ic('mais')}Nova conta</button></div></section>`;
    h += c.contasAtivas.length
      ? `<section class="grade-cards">${c.contasAtivas.map(ficha).join('')}</section>`
      : `<section class="painel"><div class="vazio"><strong>Nenhuma conta ainda</strong><span>Cadastre seu banco, carteira digital ou o dinheiro em espécie, com o saldo de hoje.</span><button type="button" class="botao primario peq" data-acao="nova-conta">Criar conta</button></div></section>`;
    if (nArquivados) {
      h += `<div><button type="button" class="botao fantasma peq" data-acao="ver-arquivadas">${S.verArquivadas ? 'Esconder arquivados' : `Mostrar arquivados (${nArquivados})`}</button></div>`;
      if (S.verArquivadas && arquivadas.length) h += `<section class="grade-cards">${arquivadas.map(ficha).join('')}</section>`;
    }

    h += `<section class="secao-titulo" style="margin-top:8px"><div><h2>Cartões de crédito</h2><span class="mudo" style="font-size:13px">Faturas de ${N.nomeMes(S.mes, true)}</span></div><button type="button" class="botao primario" data-acao="novo-cartao">${ic('mais')}Novo cartão</button></section>`;
    const cartoes = c.dados.cartoes.filter((k) => !k.arquivado || S.verArquivadas);
    if (!cartoes.length) {
      h += `<section class="painel"><div class="vazio"><strong>Nenhum cartão cadastrado</strong><span>Com o dia de fechamento e de vencimento, cada compra cai na fatura certa.</span><button type="button" class="botao peq" data-acao="novo-cartao">Cadastrar cartão</button></div></section>`;
      return h;
    }
    h += '<section class="grade-cards">';
    for (const k of cartoes) {
      const f = N.fatura(c.dados, c.itens, k, S.mes, c.hoje);
      const usado = N.limiteUsado(c.dados, c.itens, k, c.hoje);
      const lim = Number(k.limite) || 0;
      const proximas = [1, 2, 3].map((n) => N.fatura(c.dados, c.itens, k, N.addMes(S.mes, n), c.hoje)).filter((x) => x.total > 0);
      h += `<div class="ficha"><div class="ficha-cab"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="tarja" style="background:${cor(k.cor)}"></span><div style="min-width:0"><strong>${esc(k.nome)}</strong><small>fecha dia ${k.fechamento} · vence dia ${k.vencimento}${k.arquivado ? ' · arquivado' : ''}</small></div></div></div>
        ${lim ? `<div style="display:flex;flex-direction:column;gap:5px"><div class="linha-info"><span>Limite usado</span><b>${brl(usado)} de ${brl(lim)}</b></div>${barra(usado / lim, usado / lim > 0.9 ? 'estourado' : usado / lim > 0.7 ? 'alerta' : '')}<div class="linha-info"><span>Disponível</span><b>${brl(Math.max(0, lim - usado))}</b></div></div>` : ''}
        <div class="fatura-box clicavel" data-acao="ver-fatura" data-cartao="${esc(k.id)}" data-mes="${S.mes}">
          <div class="linha-info"><span class="rotulo-mini">Fatura ${N.nomeMes(S.mes)}</span>${pillFatura(f.status)}</div>
          <div class="grande">${brl(f.total)}</div>
          <div class="linha-info"><span>vence ${N.dataCurta(f.vencimento)}</span><span>${f.pago ? `pago ${brl(f.pago)}` : ''}</span></div></div>
        ${proximas.length ? `<div style="font-size:12.5px;color:var(--muted)">Próximas: ${proximas.map((x) => `${N.nomeMes(x.mes)} <b class="num" style="color:var(--ink-2)">${brl(x.total)}</b>`).join(' · ')}</div>` : ''}
        <div class="botoes">${f.restante > 0 ? `<button type="button" class="botao primario peq" data-acao="pagar-fatura" data-cartao="${esc(k.id)}" data-mes="${S.mes}">Pagar fatura</button>` : ''}<button type="button" class="botao peq" data-acao="ver-fatura" data-cartao="${esc(k.id)}" data-mes="${S.mes}">Ver itens</button><button type="button" class="botao peq" data-acao="editar-cartao" data-id="${esc(k.id)}">Editar</button></div></div>`;
    }
    h += '</section>';
    return h;
  }

  // ====================================================================
  // CONTAS FIXAS E PARCELAMENTOS
  // ====================================================================
  function vFixas() {
    const c = C();
    const regras = c.dados.recorrentes.slice().sort((a, b) => a.dia - b.dia || (a.descricao || '').localeCompare(b.descricao || ''));
    const ativaNoMes = (r) => N.difMes(r.inicio, S.mes) >= 0 && (!r.fim || N.difMes(S.mes, r.fim) >= 0);
    const ocorrencia = (r) => c.itens.find((i) => i.id === N.idOcorrencia(r.id, S.mes));
    const totDesp = N.soma(regras.filter((r) => r.tipo === 'despesa' && ativaNoMes(r)), (r) => r.valor);
    const totRec = N.soma(regras.filter((r) => r.tipo === 'receita' && ativaNoMes(r)), (r) => r.valor);
    let h = `<section class="secao-titulo"><div><h2>Contas fixas</h2><span class="mudo" style="font-size:13px">Em ${N.nomeMes(S.mes, true)}: despesas fixas <b class="num" style="color:var(--ink)">${brl(totDesp)}</b>${totRec ? ` · receitas fixas <b class="num pos">${brl(totRec)}</b>` : ''}</span></div>
      <button type="button" class="botao primario" data-acao="nova-fixa">${ic('mais')}Nova conta fixa</button></section>`;
    if (!regras.length) {
      h += `<section class="painel"><div class="vazio"><strong>Nenhuma conta fixa</strong><span>Aluguel, internet, salário… Cadastre uma vez e ela aparece em todo mês, pronta para marcar como paga.</span><button type="button" class="botao peq" data-acao="nova-fixa">Cadastrar conta fixa</button></div></section>`;
    } else {
      h += '<section class="painel"><div class="linhas">';
      for (const r of regras) {
        const oc = ativaNoMes(r) ? ocorrencia(r) : null;
        const sit = oc ? oc.situacao : null;
        const aberto = oc && (sit === 'pendente' || sit === 'atrasado') && !oc.cartaoId;
        const periodo = r.fim ? `${N.nomeMes(r.inicio)} a ${N.nomeMes(r.fim)}` : `desde ${N.nomeMes(r.inicio)}`;
        h += `<div class="linha" data-acao="editar-fixa" data-id="${esc(r.id)}" role="button" tabindex="0">
          <div class="quando"><b>${String(r.dia).padStart(2, '0')}</b>todo mês</div>
          <div class="desc"><strong>${esc(r.descricao || nomeCat(c, r.categoriaId))}</strong><div class="meta"><span style="display:inline-flex;align-items:center;gap:5px"><span class="ponto" style="background:${corCat(c, r.categoriaId)}"></span>${esc(nomeCat(c, r.categoriaId))}</span><span>${esc(nomeOnde(c, r))}</span><span>${periodo}</span></div></div>
          <div class="lado"><span class="valor">${valorComSinal(r.tipo, oc ? oc.valor : r.valor)}</span>${oc ? pill(sit, r.tipo) : '<span class="pill vazia">Fora do período</span>'}</div>
          <div class="acao-col">${aberto ? `<button type="button" class="acao-rapida" data-acao="pagar" data-id="${esc(oc.id)}" aria-label="Marcar como ${r.tipo === 'receita' ? 'recebido' : 'pago'}">${ic('check')}</button>` : '<span class="espaco-acao"></span>'}</div></div>`;
      }
      h += '</div></section>';
    }

    const parcs = c.dados.parcelamentos.map((p) => {
      const k = c.cartoes.get(p.cartaoId);
      const ps = N.parcelasDe(p, k);
      const atual = k ? mesFaturaAtual(k) : c.mesHoje;
      const faturadas = ps.filter((x) => N.difMes(x.mes, atual) >= 0).length;
      const futuras = ps.filter((x) => N.difMes(atual, x.mes) > 0);
      const noMes = ps.filter((x) => x.mes === S.mes);
      return { p, k, ps, faturadas, futuroValor: N.soma(futuras, (x) => x.valor), noMes, concluido: futuras.length === 0 };
    }).sort((a, b) => (a.p.dataCompra < b.p.dataCompra ? 1 : -1));
    const comprometido = N.soma(parcs, (x) => x.futuroValor);
    const ativos = parcs.filter((x) => !x.concluido);
    const concluidos = parcs.filter((x) => x.concluido);
    h += `<section class="secao-titulo" style="margin-top:8px"><div><h2>Parcelamentos</h2><span class="mudo" style="font-size:13px">Comprometido em parcelas futuras: <b class="num" style="color:var(--ink)">${brl(comprometido)}</b></span></div>
      <button type="button" class="botao primario" data-acao="novo-parcelamento"${c.cartoesAtivos.length ? '' : ' disabled title="Cadastre um cartão primeiro"'}>${ic('mais')}Nova compra parcelada</button></section>`;
    const linhaParc = (x) => {
      const noMes = x.noMes.length ? `Parcela${x.noMes.length > 1 ? 's' : ''} ${x.noMes.map((y) => y.num).join(', ')}/${x.p.parcelas} em ${N.nomeMes(S.mes)}` : (x.concluido ? 'Concluído' : `Nenhuma parcela em ${N.nomeMes(S.mes)}`);
      return `<div class="linha parc" data-acao="editar-parcelamento" data-id="${esc(x.p.id)}" role="button" tabindex="0">
        <div class="desc"><strong>${esc(x.p.descricao || nomeCat(c, x.p.categoriaId))}</strong><div class="meta"><span>${esc((x.k || {}).nome || 'Cartão excluído')}</span><span>${x.p.parcelas}× · ${brl(x.p.valorTotal)}</span><span>compra ${N.dataLonga(x.p.dataCompra)}</span><span class="tag">${noMes}</span></div></div>
        <div class="prog-col"><div style="font-size:12px;color:var(--muted)">${x.faturadas} de ${x.p.parcelas} faturadas</div>${barra(x.faturadas / x.p.parcelas, x.concluido ? 'ok' : '')}</div>
        <div class="lado"><span class="valor">${brl(x.futuroValor)}</span><span style="font-size:12px;color:var(--muted)">a faturar</span></div></div>`;
    };
    if (!parcs.length) {
      h += `<section class="painel"><div class="vazio"><strong>Nenhuma compra parcelada</strong><span>Ao lançar uma compra no cartão, escolha o número de parcelas. Cada parcela cai sozinha na fatura do mês certo.</span></div></section>`;
    } else {
      h += `<section class="painel">${ativos.length ? `<div class="linhas">${ativos.map(linhaParc).join('')}</div>` : '<div class="vazio"><strong>Nenhuma parcela a faturar</strong></div>'}
        ${concluidos.length ? `<div style="margin-top:10px"><button type="button" class="botao fantasma peq" data-acao="ver-concluidos">${S.verConcluidos ? 'Esconder' : 'Mostrar'} ${concluidos.length} concluído${concluidos.length > 1 ? 's' : ''}</button></div>${S.verConcluidos ? `<div class="linhas">${concluidos.map(linhaParc).join('')}</div>` : ''}` : ''}</section>`;
    }
    return h;
  }

  // ====================================================================
  // ORÇAMENTOS
  // ====================================================================
  function vOrcamentos() {
    const c = C();
    const r = N.resumoMes(c.dados, c.itens, S.mes, c.hoje);
    const cats = c.categoriasDe('despesa').map((k) => {
      const gasto = r.porCategoria.get(k.id) || 0;
      const lim = c.orc.get(k.id)?.limite || 0;
      return { k, gasto, lim, p: lim ? gasto / lim : 0, nivel: N.nivelOrcamento(gasto, lim) };
    });
    const com = cats.filter((x) => x.lim).sort((a, b) => b.p - a.p);
    const sem = cats.filter((x) => !x.lim).sort((a, b) => b.gasto - a.gasto);
    const orcado = N.soma(com, (x) => x.lim);
    const gastoCom = N.soma(com, (x) => x.gasto);
    const semCat = r.porCategoria.get('') || 0;
    let h = `<section class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="kpi"><span class="rotulo-mini">Orçado no mês</span><span class="valor">${brl(orcado)}</span><span class="det">${com.length} ${com.length === 1 ? 'categoria' : 'categorias'} com limite</span></div>
      <div class="kpi"><span class="rotulo-mini">Gasto nessas categorias</span><span class="valor">${brl(gastoCom)}</span><span class="det">${orcado ? pct(gastoCom / orcado) + ' do orçado' : 'defina limites abaixo'}</span></div>
      <div class="kpi"><span class="rotulo-mini">Ainda disponível</span><span class="valor ${orcado - gastoCom < 0 ? 'neg' : 'pos'}">${brl(orcado - gastoCom)}</span><span class="det">${com.filter((x) => x.nivel === 'estourado').length} acima do limite · ${com.filter((x) => x.nivel === 'alerta').length} perto</span></div>
    </section>`;
    const linha = (x) => `<div class="orc">
      <div class="nome"><span class="ponto" style="background:${cor(x.k.cor)}"></span><span>${esc(x.k.nome)}</span></div>
      <div class="prog"><div class="info"><span><b>${brl(x.gasto)}</b>${x.lim ? ` de ${brl(x.lim)}` : ' gasto'}</span>${x.lim ? (x.nivel === 'ok' ? `<span>${pct(x.p)}</span>` : `<span class="pill ${x.nivel}">${x.nivel === 'estourado' ? `Passou ${brl(x.gasto - x.lim)}` : pct(x.p)}</span>`) : ''}</div>${x.lim ? barra(x.p, x.nivel) : '<div class="barra"></div>'}</div>
      <label class="limite"><span class="rotulo-mini" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Limite mensal de ${esc(x.k.nome)}</span><input id="orc-${esc(x.k.id)}" data-orc="${esc(x.k.id)}" inputmode="decimal" placeholder="Sem limite" value="${x.lim ? esc(N.paraTexto(x.lim)) : ''}" autocomplete="off"></label></div>`;
    h += `<section class="painel"><div class="painel-cab"><h2>Limite mensal por categoria</h2><span class="mudo" style="font-size:12.5px">Vale para todos os meses. Verde até 80%, amarelo até 100%, vermelho acima.</span></div>
      ${cats.length ? `<div>${com.concat(sem).map(linha).join('')}</div>` : '<div class="vazio"><strong>Nenhuma categoria de despesa</strong><button type="button" class="botao peq" data-acao="aba" data-aba="config">Criar categorias</button></div>'}
      ${semCat ? `<p class="mudo" style="font-size:13px;margin:10px 0 0">Gastos sem categoria neste mês: <b class="num" style="color:var(--ink)">${brl(semCat)}</b></p>` : ''}</section>`;
    return h;
  }

  // ====================================================================
  // METAS

  function vMetas() {
    const c = C();

    if (!metas.length) {
      return h + `<section class="painel"><div class="vazio"><strong>Nenhuma meta ainda</strong><span>Reserva de emergência, uma viagem, um equipamento novo. Defina o valor e o prazo e veja quanto guardar por mês.</span><button type="button" class="botao peq" data-acao="nova-meta">Criar meta</button></div></section>`;
    }
    h += '<section class="grade-cards">';

        : `Faltam <b class="num">${brl(pr.falta)}</b>${m.prazo ? '' : ' · sem prazo'}`;
      h += `<div class="ficha"><div class="ficha-cab"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="tarja" style="background:${cor(m.cor)}"></span><div style="min-width:0"><strong>${esc(m.nome)}</strong><small>${m.prazo ? 'até ' + N.dataLonga(m.prazo) : 'sem prazo'}</small></div></div><button type="button" class="botao fantasma peq" data-acao="editar-meta" data-id="${esc(m.id)}">Editar</button></div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><span class="grande">${brl(pr.guardado)}</span><span class="mudo num" style="font-size:13px">de ${brl(m.alvo)}</span></div>
        ${barra(pr.pct, pr.atingida ? 'ok' : '')}
        <div style="font-size:13px;color:var(--ink-2)">${pct(pr.pct)} · ${det}</div>

  // ====================================================================
  // RELATÓRIOS
  // ====================================================================
  function serieMeses(n, ate) {
    const c = C();
    return N.mesesEntre(N.addMes(ate, -(n - 1)), ate).map((m) => {
      const r = N.resumoMes(c.dados, c.itens, m, c.hoje);
      return { mes: m, receitas: r.receitas, despesas: r.despesas };
    });
  }
  function vRelatorios() {
    const c = C();
    const r = N.resumoMes(c.dados, c.itens, S.mes, c.hoje);
    const serie = serieMeses(12, S.mes);
    const saldos = serieSaldo(c).map((x) => ({ mes: x.mes, saldo: x.v }));
    const A = S.compA || N.addMes(S.mes, -1);
    const B = S.compB || S.mes;
    const ra = N.resumoMes(c.dados, c.itens, A, c.hoje);
    const rb = N.resumoMes(c.dados, c.itens, B, c.hoje);
    const fatias = fatiasCategorias(c, r.porCategoria);
    const totalDesp = N.soma(fatias, (x) => x.valor);
    let h = `<section class="painel"><div class="painel-cab"><h2>Despesas por categoria em ${N.nomeMes(S.mes, true)}</h2><span class="mudo num" style="font-size:13px">${brl(totalDesp)}</span></div>
      ${fatias.length ? `<div class="rosca-bloco"><div class="grafico" data-grafico="rosca"></div>
        <div class="leg-lista">${fatias.map((x) => `<div><i class="ponto" style="background:${x.cor};width:10px;height:10px"></i><span>${esc(x.nome)}</span><b>${brl(x.valor)}</b><em>${pct(x.valor / totalDesp)}</em></div>`).join('')}</div></div>`
        : '<div class="vazio"><strong>Sem despesas neste mês</strong></div>'}</section>`;
    h += `<section class="painel"><div class="painel-cab"><h2>Receitas e despesas, últimos 12 meses</h2></div>
      <div class="grafico" data-grafico="barras" data-meses="12"></div>
      <div class="legenda"><span><i style="background:var(--pos)"></i>Receitas</span><span><i style="background:var(--neg)"></i>Despesas</span></div>
      <details class="tabela"><summary>Ver em tabela</summary><div class="tabela-wrap"><table class="dados"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Resultado</th></tr></thead><tbody>
      ${serie.map((x) => `<tr><td>${N.nomeMes(x.mes)}</td><td>${brl(x.receitas)}</td><td>${brl(x.despesas)}</td><td class="${x.receitas - x.despesas < 0 ? 'neg' : ''}">${brl(x.receitas - x.despesas)}</td></tr>`).join('')}
      </tbody></table></div></details></section>`;
    h += `<section class="painel"><div class="painel-cab"><h2>Evolução do saldo das contas</h2><span class="mudo" style="font-size:12.5px">Saldo no fim de cada mês, somando todas as contas</span></div>
      <div class="grafico" data-grafico="linha"></div>
      <details class="tabela"><summary>Ver em tabela</summary><div class="tabela-wrap"><table class="dados"><thead><tr><th>Mês</th><th>Saldo</th></tr></thead><tbody>
      ${saldos.map((x) => `<tr><td>${N.nomeMes(x.mes)}</td><td class="${x.saldo < 0 ? 'neg' : ''}">${brl(x.saldo)}</td></tr>`).join('')}</tbody></table></div></details></section>`;
    const meses = N.mesesEntre(N.addMes(c.mesHoje, -24), N.addMes(c.mesHoje, 6)).reverse();
    const catsComp = c.categoriasDe('despesa').map((k) => ({ k, a: ra.porCategoria.get(k.id) || 0, b: rb.porCategoria.get(k.id) || 0 })).filter((x) => x.a || x.b).sort((x, y) => Math.max(y.a, y.b) - Math.max(x.a, x.b));
    const dif = (a, b, sobeBom) => {
      const d = b - a;
      if (!d) return '<span class="mudo">—</span>';
      const bom = sobeBom ? d > 0 : d < 0;
      return `<span class="${bom ? 'pos' : 'neg'}">${d > 0 ? '▲ +' : '▼ '}${brl(d)}</span>`;
    };
    h += `<section class="painel"><div class="painel-cab"><h2>Comparar dois meses</h2>
      <div class="acoes"><select class="entrada" id="comp-a" style="width:auto;height:34px">${meses.map((m) => opt(m, N.nomeMes(m, true), m === A)).join('')}</select><span class="mudo" style="align-self:center">com</span><select class="entrada" id="comp-b" style="width:auto;height:34px">${meses.map((m) => opt(m, N.nomeMes(m, true), m === B)).join('')}</select></div></div>
      <div class="tabela-wrap"><table class="dados"><thead><tr><th></th><th>${N.nomeMes(A)}</th><th>${N.nomeMes(B)}</th><th>Diferença</th></tr></thead><tbody>
      <tr><td>Receitas</td><td>${brl(ra.receitas)}</td><td>${brl(rb.receitas)}</td><td>${dif(ra.receitas, rb.receitas, true)}</td></tr>
      <tr><td>Despesas</td><td>${brl(ra.despesas)}</td><td>${brl(rb.despesas)}</td><td>${dif(ra.despesas, rb.despesas, false)}</td></tr>
      ${catsComp.map((x) => `<tr><td style="font-weight:500;padding-left:22px"><span class="ponto" style="background:${cor(x.k.cor)};margin-right:7px"></span>${esc(x.k.nome)}</td><td>${brl(x.a)}</td><td>${brl(x.b)}</td><td>${dif(x.a, x.b, false)}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Resultado</td><td>${brl(ra.receitas - ra.despesas)}</td><td>${brl(rb.receitas - rb.despesas)}</td><td>${dif(ra.receitas - ra.despesas, rb.receitas - rb.despesas, true)}</td></tr></tfoot></table></div></section>`;
    return h;
  }
  /** Saldo no fim de cada mês, a partir do mês em que a primeira conta foi criada (no máximo 12 meses). */
  function serieSaldo(c) {
    const ate = N.difMes(c.mesHoje, S.mes) > 0 ? c.mesHoje : S.mes;
    const criadas = c.dados.contas.map((k) => (k.criadoEm || '').slice(0, 7)).filter(N.mesValido).sort();
    let de = N.addMes(ate, -11);
    if (criadas.length && N.difMes(de, criadas[0]) > 0) de = criadas[0];
    if (N.difMes(de, ate) < 0) de = ate;
    return N.mesesEntre(de, ate).map((m) => ({ mes: m, v: m === c.mesHoje ? N.saldoTotal(c.dados) : N.saldoTotal(c.dados, N.fimDoMes(m)) }));
  }
  function fatiasCategorias(c, porCategoria) {
    const lista = [...porCategoria.entries()].filter(([, v]) => v > 0).map(([id, v]) => ({ id, nome: nomeCat(c, id), valor: v, cor: id ? corCat(c, id) : cor(8) })).sort((a, b) => b.valor - a.valor);
    if (lista.length <= 7) return lista;
    const top = lista.slice(0, 6);
    top.push({ id: '_outras', nome: `Outras (${lista.length - 6})`, valor: N.soma(lista.slice(6), (x) => x.valor), cor: cor(8) });
    return top;
  }

  function vConfig() {

      <div class="painel"><div class="painel-cab"><h2>Categorias</h2><button type="button" class="botao peq" data-acao="nova-categoria">${ic('mais')}Nova categoria</button></div>

  const VISOES = { painel: vPainel, lancamentos: vLancamentos, contas: vContas, fixas: vFixas, orcamentos: vOrcamentos, metas: vMetas, relatorios: vRelatorios, config: vConfig };

  // ====================================================================
  // GRÁFICOS (SVG desenhado na largura real do contêiner)
  // ====================================================================
  const compacto = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
  const rotY = (c) => (c === 0 ? '0' : compacto.format(c / 100));
  function escalaBonita(max) {
    if (max <= 0) return { max: 10000, passo: 2500 };
    const bruto = max / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
    const n = bruto / mag;
    const passo = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    return { max: passo * Math.ceil(max / passo), passo };
  }
  const caminhoBarra = (x, y, w, h, r) => { if (h <= 0.5) return ''; r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };
  function desenharGraficos() {
    for (const el of $$('[data-grafico]')) {
      const w = Math.floor(el.clientWidth);
      if (!w) continue;
      const tipo = el.dataset.grafico;
      if (tipo === 'barras') el.innerHTML = gBarras(w, Number(el.dataset.meses) || 6);
      else if (tipo === 'linha') el.innerHTML = gLinha(w);
      else if (tipo === 'rosca') el.innerHTML = gRosca(Math.min(w, 200));
    }
  }
  function gBarras(W, n) {
    const serie = serieMeses(n, S.mes);
    const H = 210, L = 46, R = 6, T = 10, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const esc_ = escalaBonita(Math.max(...serie.map((x) => Math.max(x.receitas, x.despesas))));
    const y = (v) => T + ph - (v / esc_.max) * ph;
    const banda = pw / serie.length;
    const bw = Math.max(4, Math.min(20, banda * 0.3));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Receitas e despesas por mês">`;
    for (let v = 0; v <= esc_.max + 1; v += esc_.passo) {
      s += `<line class="${v === 0 ? 'eixo' : 'grade-linha'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${rotY(v)}</text>`;
    }
    serie.forEach((x, i) => {
      const cx = L + banda * i + banda / 2;
      s += `<path d="${caminhoBarra(cx - bw - 1, y(x.receitas), bw, y(0) - y(x.receitas), 4)}" fill="var(--pos)"/>`;
      s += `<path d="${caminhoBarra(cx + 1, y(x.despesas), bw, y(0) - y(x.despesas), 4)}" fill="var(--neg)"/>`;
      const atual = x.mes === S.mes;
      const mostrar = serie.length <= 6 || banda >= 40 || i % 2 === serie.length % 2 || atual;
      if (mostrar) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="${atual ? 'fill:var(--ink);font-weight:700' : ''}">${N.nomeMesCurto(x.mes)}</text>`;
      const tip = `${N.nomeMes(x.mes, true)}\nReceitas: ${brl(x.receitas)}\nDespesas: ${brl(x.despesas)}\nResultado: ${brl(x.receitas - x.despesas)}`;
      s += `<rect x="${L + banda * i}" y="${T}" width="${banda}" height="${ph}" fill="transparent" data-tip="${esc(tip)}"/>`;
    });
    return s + '</svg>';
  }
  function gLinha(W) {
    const c = C();
    const pts = serieSaldo(c);
    const H = 210, L = 52, R = 14, T = 14, B = 26;
    const pw = W - L - R, ph = H - T - B;
    const mx = Math.max(0, ...pts.map((p) => p.v));
    const mn = Math.min(0, ...pts.map((p) => p.v));
    const e1 = escalaBonita(mx), e2 = escalaBonita(-mn);
    const passo = Math.max(e1.passo, mn < 0 ? e2.passo : 0);
    const top = passo * Math.ceil(mx / passo) || passo, fundo = mn < 0 ? -passo * Math.ceil(-mn / passo) : 0;
    const y = (v) => T + ph - ((v - fundo) / (top - fundo)) * ph;
    const x = (i) => L + (pts.length === 1 ? pw / 2 : (pw * i) / (pts.length - 1));
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Saldo no fim de cada mês">`;
    for (let v = fundo; v <= top + 1; v += passo) s += `<line class="${v === 0 ? 'eixo' : 'grade-linha'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${rotY(v)}</text>`;
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    s += `<path d="${d}L${x(pts.length - 1)},${y(Math.max(0, fundo))}L${x(0)},${y(Math.max(0, fundo))}Z" fill="var(--accent)" opacity=".12"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const ult = pts.length - 1;
    s += `<circle cx="${x(ult)}" cy="${y(pts[ult].v)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<text x="${Math.min(x(ult), W - R)}" y="${y(pts[ult].v) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${esc(brl(pts[ult].v))}</text>`;
    const passoX = pw / Math.max(1, pts.length - 1);
    pts.forEach((p, i) => {
      if (pts.length <= 6 || passoX >= 40 || i % 2 === ult % 2) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${N.nomeMesCurto(p.mes)}</text>`;
      s += `<rect x="${x(i) - passoX / 2}" y="${T}" width="${passoX}" height="${ph}" fill="transparent" data-tip="${esc(`${N.nomeMes(p.mes, true)}\nSaldo: ${brl(p.v)}`)}"/>`;
    });
    return s + '</svg>';
  }
  function gRosca(W) {
    const c = C();
    const r = N.resumoMes(c.dados, c.itens, S.mes, c.hoje);
    const fatias = fatiasCategorias(c, r.porCategoria);
    const total = N.soma(fatias, (x) => x.valor);
    const R = W / 2, esp = Math.max(18, W * 0.14), raio = R - esp / 2, circ = 2 * Math.PI * raio;
    let s = `<svg viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" role="img" aria-label="Despesas por categoria">`;
    s += `<circle cx="${R}" cy="${R}" r="${raio}" fill="none" stroke="var(--surface-2)" stroke-width="${esp}"/>`;
    let acc = 0;
    const gap = fatias.length > 1 ? 2 : 0;
    for (const f of fatias) {
      const len = (f.valor / total) * circ;
      const vis = Math.max(0.5, len - gap);
      s += `<circle cx="${R}" cy="${R}" r="${raio}" fill="none" stroke="${f.cor}" stroke-width="${esp}" stroke-dasharray="${vis} ${circ - vis}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${R} ${R})" data-tip="${esc(`${f.nome}\n${brl(f.valor)} · ${pct(f.valor / total)}`)}"/>`;
      acc += len;
    }
    s += `<text x="${R}" y="${R - 4}" text-anchor="middle" style="font-size:11px">Total</text><text x="${R}" y="${R + 14}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:${W < 170 ? 12 : 14}px;font-family:var(--f-num)">${esc(brl(total))}</text>`;
    return s + '</svg>';
  }
  // dica flutuante
  const tip = $('#tip');
  function mostrarTip(el, x, yy) {
    tip.textContent = el.dataset.tip;
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + 'px';
    tip.style.top = Math.max(8, Math.min(innerHeight - r.height - 8, yy + 14)) + 'px';
  }
  document.addEventListener('pointermove', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrarTip(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('pointerdown', (e) => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) mostrarTip(el, e.clientX, e.clientY); else tip.hidden = true; });
  addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
  if (window.ResizeObserver) {
    let ultimaLargura = 0;
    new ResizeObserver(() => { const w = $('#conteudo').clientWidth; if (w !== ultimaLargura) { ultimaLargura = w; desenharGraficos(); } }).observe($('#conteudo'));

  function chipsCategorias(c, tipo, sel) {

  /** Novo lançamento ou edição de um lançamento existente (inclui ocorrência de conta fixa). */
  function formLancamento(opts = {}) {
    const c = C();
    if (!c.contasAtivas.length && !c.cartoesAtivos.length && !opts.item) return semOndeLancar();
    const it = opts.item || null;
    const editando = !!it;
    const ehRec = !!(it && it.origem === 'recorrente');
    const tipoIni = it ? it.tipo : (opts.tipo || 'despesa');
    const ultimo = pref.ler('ultimoOnde', '');
    const ondeValido = (v) => { const [k, id] = String(v).split(':'); return k === 'conta' ? !!c.contas.get(id) && !c.contas.get(id).arquivada : k === 'cartao' ? !!c.cartoes.get(id) && !c.cartoes.get(id).arquivado : false; };

    if (!it && tipoIni === 'receita' && onde.startsWith('cartao') && c.contasAtivas[0]) onde = 'conta:' + c.contasAtivas[0].id;
    const status = it ? (it.status === 'pago' ? 'pago' : 'pendente') : 'pago';

      <div style="display:flex;flex-direction:column;gap:16px">

      ${!editando ? `<div class="seg tipo" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="tipo" value="despesa"${tipoIni === 'despesa' ? ' checked' : ''}><span>Despesa</span></label><label><input type="radio" name="tipo" value="receita"${tipoIni === 'receita' ? ' checked' : ''}><span>Receita</span></label><label><input type="radio" name="tipo" value="transferencia"${tipoIni === 'transferencia' ? ' checked' : ''}${contasT.length < 2 ? ' disabled' : ''}><span title="${contasT.length < 2 ? 'Precisa de duas contas' : ''}">Transferência</span></label></div>`
        : `<div class="seg tipo" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="tipo" value="despesa"${tipoIni === 'despesa' ? ' checked' : ''}><span>Despesa</span></label><label><input type="radio" name="tipo" value="receita"${tipoIni === 'receita' ? ' checked' : ''}><span>Receita</span></label></div>`}
      ${valorCampo('fl-valor', it ? it.valor : '', 'Valor', 'autofocus')}
      <label class="campo"><span>Descrição</span><input id="fl-desc" maxlength="80" autocomplete="off" placeholder="Ex.: Supermercado, conta de luz" value="${esc(it ? it.descricao : '')}"></label>
      <div id="bloco-normal" style="display:flex;flex-direction:column;gap:16px">
        <fieldset class="campo"><legend>Categoria</legend><div class="chips" id="cats-despesa">${chipsCategorias(c, 'despesa', it && it.tipo === 'despesa' ? it.categoriaId : null)}</div><div class="chips" id="cats-receita">${chipsCategorias(c, 'receita', it && it.tipo === 'receita' ? it.categoriaId : null)}</div></fieldset>
        <div class="campos">
          <label class="campo"><span>Conta ou cartão</span><select id="fl-onde"></select></label>
          <label class="campo" id="c-forma"><span>Forma de pagamento</span><select id="fl-forma">${FORMAS.filter(([v]) => v !== 'credito').map(([v, t]) => opt(v, t, (it ? it.pagamento : pref.ler('ultimaForma', 'pix')) === v)).join('')}</select></label>
          <fieldset class="campo" id="c-status"><legend id="rot-status">Situação</legend><div class="seg"><label><input type="radio" name="status" value="pago"${status === 'pago' ? ' checked' : ''}><span id="rot-pago">Pago</span></label><label><input type="radio" name="status" value="pendente"${status === 'pendente' ? ' checked' : ''}><span id="rot-pend">A pagar</span></label></div></fieldset>
          <label class="campo"><span id="rot-data">Data</span><input type="date" id="fl-data" value="${esc(dataIni)}"></label>
          <label class="campo" id="c-pagoem" hidden><span id="rot-pagoem">Pago em</span><input type="date" id="fl-pagoem" value="${esc(it && it.dataPagamento ? it.dataPagamento : N.hoje())}"></label>
          <label class="campo" id="c-parc"${editando ? ' hidden' : ''}><span>Parcelas</span><select id="fl-parc">${opt('1', 'À vista', true)}${Array.from({ length: 47 }, (_, i) => opt(String(i + 2), `${i + 2}×`, false)).join('')}</select></label>
        </div>
        <div class="previa" id="fl-previa" hidden></div>
        ${!editando ? '<label class="check" id="c-rep"><input type="checkbox" id="fl-rep"> Repetir todo mês (vira conta fixa)</label>' : ''}
      </div>
      <div id="bloco-transf" hidden><div class="campos">
        <label class="campo"><span>De</span><select id="ft-de">${opcoesContas(c, contasT[0] && contasT[0].id)}</select></label>
        <label class="campo"><span>Para</span><select id="ft-para">${opcoesContas(c, contasT[1] && contasT[1].id)}</select></label>
        <label class="campo"><span>Data</span><input type="date" id="ft-data" value="${N.hoje()}"></label></div>
        <p class="mudo" style="font-size:12.5px;margin:10px 0 0">Transferência muda o saldo das duas contas, mas não conta como receita nem como despesa.</p></div>
      <div class="erro-campo" aria-live="polite"></div>
      </div></form>`;
    abrirModal({
      titulo, corpo, rodape: rodapeForm(esquerda),
      aoMontar: (v) => {
        const sel = $('#fl-onde', v);
        const sync = () => {
          const tipo = radio(v, 'tipo') || tipoIni;
          const transf = tipo === 'transferencia';
          $('#bloco-normal', v).hidden = transf;
          $('#bloco-transf', v).hidden = !transf;
          if (transf) return;
          const atual = sel.value || onde;
          sel.innerHTML = opcoesOnde(c, tipo, atual, it);
          if (!sel.value && sel.options.length) sel.selectedIndex = 0;
          const [k] = sel.value.split(':');
          const cartao = k === 'cartao';
          $('#cats-despesa', v).hidden = tipo !== 'despesa';
          $('#cats-receita', v).hidden = tipo !== 'receita';
          $('#c-forma', v).hidden = cartao;
          $('#c-status', v).hidden = cartao;
          const pend = radio(v, 'status') === 'pendente';
          $('#rot-pago', v).textContent = tipo === 'receita' ? 'Recebido' : 'Pago';
          $('#rot-pend', v).textContent = tipo === 'receita' ? 'A receber' : 'A pagar';
          $('#rot-data', v).textContent = cartao ? 'Data da compra' : pend ? 'Vencimento' : 'Data';
          $('#c-pagoem', v).hidden = !(editando && !cartao && !pend);
          $('#rot-pagoem', v).textContent = tipo === 'receita' ? 'Recebido em' : 'Pago em';
          const cParc = $('#c-parc', v);
          if (cParc && !editando) cParc.hidden = !cartao || tipo !== 'despesa';
          const nParc = cartao && !editando ? Number($('#fl-parc', v).value) : 1;
          const rep = $('#c-rep', v);
          if (rep) rep.hidden = nParc > 1;
          const repetir = rep && !rep.hidden && $('#fl-rep', v).checked;
          const prev = $('#fl-previa', v);
          const data = $('#fl-data', v).value;
          const valor = N.paraCentavos($('#fl-valor', v).value);
          let txt = '';
          if (N.dataValida(data)) {
            if (cartao) {
              const k2 = c.cartoes.get(sel.value.split(':')[1]);
              const V = N.mesFatura(k2, data);
              if (nParc > 1) {
                const vals = N.valoresParcelas(valor > 0 ? valor : 0, nParc);
                txt = `${nParc}× de ${brl(vals[1])}${vals[0] !== vals[1] ? ` (1ª de ${brl(vals[0])})` : ''}. A 1ª cai na fatura de ${N.nomeMes(V)} e a última na de ${N.nomeMes(N.addMes(V, nParc - 1))}.`;
              } else txt = `Entra na fatura de ${N.nomeMes(V, true)}, que vence em ${N.dataLonga(N.vencimentoDe(k2, V))}.`;
            }
            if (repetir) txt = (txt ? txt + ' ' : '') + `Repete todo dia ${N.dia(data)}, a partir de ${N.nomeMes(N.mesDe(data))}.`;
          }
          prev.hidden = !txt;
          prev.textContent = txt;
        };
        v.addEventListener('change', sync);
        v.addEventListener('input', (e) => { if (e.target.id === 'fl-valor') sync(); });
        sync();
        const regra = v.querySelector('[data-x=regra]');
        if (regra) regra.onclick = () => { const r = c.recs.get(it.recorrenteId); if (r) { fecharModal(v); modalRecorrente(r); } else toast('A conta fixa deste mês não existe mais.', { tipo: 'erro' }); };
        const bEx = v.querySelector('[data-x=excluir]');

            if (await apagar('lancamentos', it.id)) { fecharModal(v); toast('Lançamento excluído'); }
          }

          const doc = materializar(it, { ignorada: true });

        };
        const bRest = v.querySelector('[data-x=restaurar]');
        if (bRest) bRest.onclick = async () => { if (await gravar('lancamentos', materializar(it, { ignorada: false }))) { fecharModal(v); toast('Este mês voltou a contar'); } };
        ligarEnvio(v, () => salvarLancamento(v, it));
      },
    });

  function materializar(it, extra) {
    const base = it.fonte === 'virtual' ? {
      id: it.id, tipo: it.tipo, valor: it.valor, descricao: it.descricao, categoriaId: it.categoriaId || null,
      contaId: it.contaId || null, cartaoId: it.cartaoId || null, pagamento: it.pagamento || null, data: it.data,
      vencimento: it.cartaoId ? null : it.vencimento, status: it.cartaoId ? 'cartao' : 'pendente', origem: 'recorrente',
      recorrenteId: it.recorrenteId, mesRecorrencia: it.mesRecorrencia, criadoEm: new Date().toISOString(),
    } : { ...(C().dados.lancamentos.find((l) => l.id === it.id) || {}) };
    return { ...base, ...extra };
  }

  async function salvarLancamento(v, it) {
    const c = C();
    const tipo = radio(v, 'tipo') || it.tipo;
    const valor = N.paraCentavos($('#fl-valor', v).value);
    if (!(valor > 0)) return 'Informe um valor maior que zero, como 45,90.';
    const descricao = $('#fl-desc', v).value.trim();
    const agora = new Date().toISOString();
    if (tipo === 'transferencia') {
      const de = $('#ft-de', v).value, para = $('#ft-para', v).value, data = $('#ft-data', v).value;
      if (!de || !para) return 'Escolha as duas contas.';
      if (de === para) return 'Escolha contas diferentes para origem e destino.';
      if (!N.dataValida(data)) return 'Informe uma data válida.';
      const ok = await gravar('lancamentos', { id: D.novoId('tr'), tipo: 'transferencia', valor, descricao: descricao || 'Transferência', contaId: de, contaDestinoId: para, data, criadoEm: agora });
      if (ok) toast('Transferência registrada');
      return ok;
    }
    const ondeV = $('#fl-onde', v).value;
    if (!ondeV) return 'Escolha a conta ou o cartão.';
    const [k, ondeId] = ondeV.split(':');
    const cartao = k === 'cartao';
    if (cartao && tipo === 'receita') return 'Receita entra numa conta, não no cartão.';
    const data = $('#fl-data', v).value;
    if (!N.dataValida(data)) return 'Informe uma data válida.';
    const categoriaId = radio(v, 'cat-' + tipo) || null;
    const status = cartao ? 'cartao' : (radio(v, 'status') || 'pago');
    const pagamento = cartao ? 'credito' : $('#fl-forma', v).value;
    pref.gravar('ultimoOnde', ondeV);
    if (!cartao) pref.gravar('ultimaForma', pagamento);
    const nParc = cartao && !it ? Number($('#fl-parc', v).value) : 1;
    if (nParc > 1) {
      const ok = await gravar('parcelamentos', { id: D.novoId('pc'), descricao, valorTotal: valor, parcelas: nParc, cartaoId: ondeId, dataCompra: data, categoriaId, antecipacoes: [], criadoEm: agora });
      if (ok) toast(`Compra em ${nParc}× registrada`);
      return ok;
    }
    let dataPagamento = null;
    if (status === 'pago') {
      const pe = $('#fl-pagoem', v).value;
      dataPagamento = it && N.dataValida(pe) ? pe : data;
    }
    const campos = { tipo, valor, descricao, categoriaId, contaId: cartao ? null : ondeId, cartaoId: cartao ? ondeId : null, pagamento, data, vencimento: cartao ? null : data, status, dataPagamento };
    if (it) {
      const doc = materializar(it, campos);
      const ok = await gravar('lancamentos', doc);
      if (ok) toast('Lançamento atualizado');
      return ok;
    }
    const repetir = $('#fl-rep', v) && !$('#c-rep', v).hidden && $('#fl-rep', v).checked;
    if (repetir) {
      const rid = D.novoId('rc');
      const regra = { id: rid, descricao, tipo, valor, dia: N.dia(data), categoriaId, contaId: campos.contaId, cartaoId: campos.cartaoId, pagamento, inicio: N.mesDe(data), fim: null, criadoEm: agora };
      if (!(await gravar('recorrentes', regra))) return false;
      if (!cartao && status === 'pago') {
        const mes = N.mesDe(data);
        await gravar('lancamentos', { ...campos, id: N.idOcorrencia(rid, mes), origem: 'recorrente', recorrenteId: rid, mesRecorrencia: mes, criadoEm: agora });
      }
      toast('Conta fixa criada');
      return true;
    }
    const ok = await gravar('lancamentos', { id: D.novoId('lc'), ...campos, origem: 'manual', criadoEm: agora });
    if (ok) toast(tipo === 'receita' ? 'Receita registrada' : 'Despesa registrada');
    return ok;
  }

  function formTransferencia(l) {
    const c = C();
    abrirModal({
      titulo: 'Editar transferência',
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:16px">${valorCampo('ft-valor', l.valor)}

        <label class="campo"><span>Data</span><input type="date" id="ft-data" value="${esc(l.data)}"></label></div><div class="erro-campo"></div></form>`,

      aoMontar: (v) => {
        v.querySelector('[data-x=excluir]').onclick = async () => {
          if (await confirmar({ titulo: 'Excluir transferência?', texto: `${esc(brl(l.valor))} voltam para a conta de origem.`, botao: 'Excluir', perigo: true })) { if (await apagar('lancamentos', l.id)) { fecharModal(v); toast('Transferência excluída'); } }
        };
        ligarEnvio(v, async () => {

          if (!N.dataValida(data)) return 'Informe uma data válida.';
          const ok = await gravar('lancamentos', { ...l, valor, contaId: de, contaDestinoId: para, data, descricao: $('#ft-desc', v).value.trim() || 'Transferência' });

          return ok;
        });
      },
    });
  }

  async function marcarPago(id) {
    const c = C();
    const it = c.itens.find((x) => x.id === id);
    if (!it || it.cartaoId) return;
    const quando = N.hoje();
    const msg = it.tipo === 'receita' ? 'Marcado como recebido' : 'Marcado como pago';
    if (it.fonte === 'virtual') {
      if (await gravar('lancamentos', materializar(it, { status: 'pago', dataPagamento: quando }))) toast(msg, { desfazer: () => apagar('lancamentos', it.id) });
    } else {
      const orig = c.dados.lancamentos.find((l) => l.id === id);
      if (await gravar('lancamentos', { ...orig, status: 'pago', dataPagamento: quando })) toast(msg, { desfazer: () => gravar('lancamentos', orig) });
    }
  }

        if (b('arquivar')) b('arquivar').onclick = async () => { if (await gravar('cartoes', { ...k, arquivado: true })) { fecharModal(v); toast('Cartão arquivado'); } };

          const doc = { ...(k || { id: D.novoId('cc'), criadoEm: new Date().toISOString(), arquivado: false }), nome, limite, fechamento: Number($('#cc-fech', v).value), vencimento: Number($('#cc-venc', v).value), contaPadrao: $('#cc-conta', v).value || null, cor: Number(radio(v, 'cc-cor') || 0) };
          const ok = await gravar('cartoes', doc);

  function modalFatura(cartaoId, V) {
    const c0 = C();
    const k = c0.cartoes.get(cartaoId);
    if (!k) return;
    let mes = V;
    const corpo = () => {
      const c = C();
      const f = N.fatura(c.dados, c.itens, k, mes, c.hoje);
      const pagamentos = c.dados.lancamentos.filter((l) => l.tipo === 'transferencia' && l.faturaCartaoId === k.id && l.faturaMes === mes).sort((a, b) => (a.data < b.data ? -1 : 1));
      const itens = f.itens.slice().sort((a, b) => (a.data < b.data ? -1 : 1));
      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div class="seletor-mes"><button type="button" data-y="ant" aria-label="Fatura anterior">${ic('esq')}</button><div class="rotulo">${N.nomeMes(mes, true)}</div><button type="button" data-y="prox" aria-label="Próxima fatura">${ic('dir')}</button></div>${pillFatura(f.status)}</div>
        <div class="fatura-box"><div class="linha-info"><span>Total</span><b class="num" style="font-size:18px">${brl(f.total)}</b></div>
          <div class="linha-info"><span>Fecha em ${N.dataLonga(f.fechamento)} · vence em ${N.dataLonga(f.vencimento)}</span></div>
          ${f.pago ? `<div class="linha-info"><span>Pago</span><b class="pos">${brl(f.pago)}</b></div><div class="linha-info"><span>Falta pagar</span><b>${brl(f.restante)}</b></div>` : ''}</div>
        <div>${itens.length ? itens.map((i) => `<div class="item-simples"><div class="esq"><span class="ponto" style="background:${corCat(c, i.categoriaId)}"></span><div><strong>${esc(i.descricao || nomeCat(c, i.categoriaId))}</strong><small>${N.dataCurta(i.data)}${i.parcela ? ` · parcela ${i.parcela.num}/${i.parcela.de}${i.parcela.antecipada ? ' antecipada' : ''}` : ''}${i.origem === 'recorrente' ? ' · conta fixa' : ''}</small></div></div><div class="dir"><b class="num">${brl(i.valor)}</b></div></div>`).join('') : '<div class="vazio"><strong>Nenhuma compra nesta fatura</strong></div>'}</div>
        ${pagamentos.length ? `<div><div class="rotulo-mini" style="margin-bottom:4px">Pagamentos</div>${pagamentos.map((l) => `<div class="item-simples"><div class="esq"><div><strong>${N.dataLonga(l.data)}</strong><small>de ${esc((c.contas.get(l.contaId) || {}).nome || 'conta excluída')}</small></div></div><div class="dir"><b class="num pos">${brl(l.valor)}</b><button type="button" class="botao fantasma peq" data-excluir-pg="${esc(l.id)}">Desfazer</button></div></div>`).join('')}</div>` : ''}`;
    };
    abrirModal({
      titulo: `Fatura ${esc(k.nome)}`, largo: true, fecharNoVeu: true,
      corpo: '<div id="fat-corpo" style="display:flex;flex-direction:column;gap:14px"></div>',
      rodape: '<div class="dir"><button type="button" class="botao" data-fechar>Fechar</button><button type="button" class="botao primario" data-x="pagar">Pagar fatura</button></div>',
      aoMontar: (v) => {
        const desenhar = () => {
          $('#fat-corpo', v).innerHTML = corpo();
          const f = N.fatura(C().dados, C().itens, k, mes, N.hoje());
          v.querySelector('[data-x=pagar]').hidden = f.restante <= 0;
        };
        desenhar();
        const parar = D.ouvir(() => { if (v.isConnected) setTimeout(desenhar, 0); else parar(); });
        v.addEventListener('click', async (e) => {
          const y = e.target.closest('[data-y]');
          if (y) { mes = N.addMes(mes, y.dataset.y === 'ant' ? -1 : 1); desenhar(); return; }
          const pg = e.target.closest('[data-excluir-pg]');
          if (pg && await confirmar({ titulo: 'Desfazer pagamento?', texto: 'O valor volta para a conta e a fatura fica em aberto de novo.', botao: 'Desfazer pagamento', perigo: true })) { if (await apagar('lancamentos', pg.dataset.excluirPg)) toast('Pagamento desfeito'); }
        });
        v.querySelector('[data-x=pagar]').onclick = () => modalPagarFatura(k.id, mes);
      },
    });
  }
  function modalPagarFatura(cartaoId, V) {
    const c = C();
    const k = c.cartoes.get(cartaoId);
    const f = N.fatura(c.dados, c.itens, k, V, c.hoje);
    if (!c.contasAtivas.length) return semOndeLancar();
    abrirModal({
      titulo: `Pagar fatura de ${N.nomeMes(V)}`,
      corpo: `<form novalidate style="display:flex;flex-direction:column;gap:16px">
        <div class="previa">${esc(k.nome)}: falta pagar ${brl(f.restante)} de ${brl(f.total)}. Vence em ${N.dataLonga(f.vencimento)}.</div>
        ${valorCampo('pf-valor', f.restante)}
        <div class="campos"><label class="campo"><span>Pagar com a conta</span><select id="pf-conta">${opcoesContas(c, k.contaPadrao && c.contas.get(k.contaPadrao) && !c.contas.get(k.contaPadrao).arquivada ? k.contaPadrao : c.contasAtivas[0].id)}</select></label>
        <label class="campo"><span>Data do pagamento</span><input type="date" id="pf-data" value="${N.hoje()}"></label></div>
        <p class="mudo" style="font-size:12.5px;margin:0">O valor sai da conta, mas não conta como despesa de novo: as compras da fatura já foram contadas.</p>
        <div class="erro-campo"></div></form>`,
      rodape: rodapeForm('', 'Registrar pagamento'),
      aoMontar: (v) => ligarEnvio(v, async () => {
        const valor = N.paraCentavos($('#pf-valor', v).value);
        const data = $('#pf-data', v).value;
        if (!(valor > 0)) return 'Informe um valor maior que zero.';
        if (!N.dataValida(data)) return 'Informe uma data válida.';
        const ok = await gravar('lancamentos', { id: D.novoId('pf'), tipo: 'transferencia', valor, descricao: `Fatura ${k.nome} ${N.nomeMes(V)}`, contaId: $('#pf-conta', v).value, faturaCartaoId: k.id, faturaMes: V, data, criadoEm: new Date().toISOString() });
        if (ok) toast(valor >= f.restante ? 'Fatura paga' : `Pagamento parcial de ${brl(valor)} registrado`);
        return ok;
      }),
    });
  }

          if (await confirmar({ titulo: 'Excluir conta fixa?', texto: `“${esc(r.descricao)}” deixa de aparecer nos próximos meses. Os meses já pagos continuam no histórico. Se quiser só parar a partir de um mês, use “Termina em”.`, botao: 'Excluir', perigo: true })) {

        <label class="campo"><span>Descrição</span><input id="pc-desc" maxlength="80" placeholder="Ex.: Geladeira" value="${esc(p ? p.descricao : '')}"></label>

          <label class="campo"><span>Data da compra</span><input type="date" id="pc-data" value="${esc(p ? p.dataCompra : N.hoje())}"${travado ? ' disabled' : ''}></label>

        <div class="previa" id="pc-previa"></div>

          $('#pc-previa', v).textContent = `${x.parcelas}× de ${brl(N.valoresParcelas(x.valorTotal, x.parcelas)[1] || 0)}. Da fatura de ${N.nomeMes(ps[0].mes)} até a de ${N.nomeMes(ps[ps.length - 1].mes)}.`;
          const tab = $('#pc-tabela', v);
          if (tab) {
            tab.innerHTML = `<details class="tabela"><summary>Ver as ${ps.length} parcelas</summary><div class="tabela-wrap"><table class="dados"><thead><tr><th>Parcela</th><th>Fatura</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${ps.map((y) => `<tr><td>${y.num}/${y.de}</td><td>${N.nomeMes(y.mes)}</td><td>${brl(y.valor)}</td><td style="font-family:var(--f-ui)">${y.antecipada ? 'antecipada' : N.difMes(y.mes, fa) >= 0 ? 'faturada' : 'a faturar'}</td></tr>`).join('')}</tbody></table></div></details>`;

          if (await confirmar({ titulo: 'Excluir compra parcelada?', texto: `Todas as ${p.parcelas} parcelas de “${esc(p.descricao)}” saem das faturas, inclusive as já faturadas. Faturas que você já pagou podem ficar com pagamento a mais.`, botao: 'Excluir', perigo: true })) {
            if (await apagar('parcelamentos', p.id)) { fecharModal(v); toast('Compra parcelada excluída'); }

        if (b('antecipar')) b('antecipar').onclick = () => modalAntecipar(p, false, v);
        if (b('quitar')) b('quitar').onclick = () => modalAntecipar(p, true, v);
        if (b('desfazer')) b('desfazer').onclick = async () => {
          if (await confirmar({ titulo: 'Desfazer antecipação?', texto: 'As parcelas voltam para as faturas originais, com o valor original (sem o desconto).', botao: 'Desfazer' })) {

        };
        ligarEnvio(v, async () => {
          const x = atual();
          if (!travado) {
            if (!(x.valorTotal > 0)) return 'Informe o valor total da compra.';
            if (!x.cartaoId) return 'Escolha o cartão.';
            if (!N.dataValida(x.dataCompra)) return 'Informe a data da compra.';
          }
          const doc = travado ? { ...p } : { ...x };
          doc.descricao = $('#pc-desc', v).value.trim();

          if (!p) { doc.id = D.novoId('pc'); doc.criadoEm = new Date().toISOString(); }
          const ok = await gravar('parcelamentos', doc);
          if (ok) toast(p ? 'Compra atualizada' : `Compra em ${doc.parcelas}× registrada`);
